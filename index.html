<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎾 Tatu Cup 5 — Categoria C</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; color: #333; }

    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; position: relative; }
    .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
    .modal h2 { margin: 0 0 8px 0; font-size: 22px; text-align: center; }
    .modal .subtitle { text-align: center; color: #666; margin: 0 0 20px 0; font-size: 13px; }
    .modal input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; margin-bottom: 12px; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-admin-modal { background: #007AFF; color: white; }
    .btn-cancel { background: #f0f0f0; border: 1px solid #ddd; }
    .alert-modal { margin-bottom: 12px; padding: 10px; border-radius: 6px; font-size: 13px; }
    .alert-error { background: #ffebee; color: #c62828; }
    .alert-success { background: #e8f5e9; color: #2e7d32; }

    /* Setup */
    .setup { max-width: 620px; margin: 30px auto; background: white; border: 1px solid #ddd; border-radius: 12px; padding: 28px; }
    .setup h2 { margin: 0 0 12px 0; font-size: 20px; }
    .setup p, .setup li { color: #555; font-size: 14px; line-height: 1.6; }
    .setup ol { padding-left: 20px; }
    .setup input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; margin: 12px 0; }
    .setup code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .link-box { background: #f0f7ff; border: 1px solid #b6d9ff; border-radius: 8px; padding: 12px; font-size: 12px; word-break: break-all; margin-top: 12px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #ddd; padding-bottom: 12px; gap: 12px; }
    .header h1 { margin: 0; font-size: 20px; }
    .header-info { font-size: 12px; color: #666; margin-top: 4px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .sync-dot { font-size: 11px; color: #4caf50; white-space: nowrap; }
    .sync-dot.erro { color: #f44336; }
    .sync-dot.salvando { color: #ff9800; }
    .admin-toggle { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 16px; color: #999; }
    .admin-toggle.active { background: #e3f2fd; border-color: #007AFF; color: #007AFF; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid #ddd; overflow-x: auto; }
    .tab-button { padding: 12px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; color: #999; font-size: 13px; white-space: nowrap; }
    .tab-button.active { color: #333; border-bottom-color: #007AFF; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section-card h3 { margin: 0 0 14px 0; font-size: 16px; }

    /* Grupos */
    .grupos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .grupo-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 14px; }
    .grupo-badge { background: #007AFF; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .grupo-header { margin-bottom: 12px; }

    .ranking-table { width: 100%; border-collapse: collapse; }
    .ranking-table th { padding: 8px 4px; border-bottom: 1px solid #ddd; color: #999; font-weight: 600; font-size: 10px; text-transform: uppercase; text-align: center; }
    .ranking-table th:nth-child(2) { text-align: left; }
    .ranking-table td { padding: 8px 4px; border-bottom: 1px solid #eee; font-size: 12px; text-align: center; }
    .ranking-table td:nth-child(2) { text-align: left; }
    .ranking-table tr.classificado td { background: #f1f8f2; }
    .player-nome { font-weight: 500; font-size: 13px; margin: 0; }
    .player-clube { font-size: 10px; color: #999; margin: 2px 0 0 0; }
    .stat-positivo { color: #4caf50; font-weight: 600; }
    .stat-negativo { color: #f44336; }
    .stat-neutro { color: #333; }

    /* Jogos */
    .jogo-grupo { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .jogo-grupo h3 { margin: 0 0 14px 0; font-size: 15px; }
    .rodada-games { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    .jogo-placar { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .jogo-placar.played { background: #e8f5e9; border-color: #a5d6a7; }
    .jogo-status { font-size: 11px; font-weight: 600; color: #4caf50; display: block; margin-bottom: 8px; }
    .placar-container { display: flex; align-items: flex-end; gap: 8px; }
    .placar-jogador { flex: 1; min-width: 0; }
    .placar-jogador-nome { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .placar-jogador-clube { font-size: 10px; color: #999; margin-bottom: 6px; }
    .placar-input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; font-weight: 600; text-align: center; }
    .placar-input:focus { border-color: #007AFF; outline: none; }
    .placar-input:disabled { background: #f0f0f0; color: #333; }
    .placar-vs-texto { font-size: 12px; color: #999; padding-bottom: 12px; }
    .jogo-acoes { display: flex; gap: 8px; margin-top: 10px; }

    .btn { padding: 10px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; }
    .btn-primary { background: #007AFF; color: white; }
    .btn-secondary { background: #f0f0f0; border: 1px solid #ddd; }
    .btn-danger { background: #ffebee; color: #f44336; border: 1px solid #ffcdd2; }

    /* Sorteio */
    .sorteio-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .sorteio-item { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 10px; cursor: pointer; margin-bottom: 8px; }
    .sorteio-item.selected { border: 2px solid #007AFF; background: #e3f2fd; }
    .sorteio-item-name { font-weight: 500; font-size: 13px; }
    .sorteio-item-pts { font-size: 11px; color: #999; margin-top: 2px; }

    /* Fase 2 */
    .fase2-grupos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .fase2-grupo { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    .fase2-grupo h4 { margin: 0 0 12px 0; font-size: 14px; }
    .badge-g1 { background: #6a4de0; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-g2 { background: #e07a4d; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }

    /* Chave */
    .chave { display: flex; gap: 16px; overflow-x: auto; padding: 4px 0 12px 0; }
    .chave-col { min-width: 250px; flex: 1; }
    .chave-titulo { font-weight: 600; font-size: 12px; color: #999; margin-bottom: 12px; text-transform: uppercase; }
    .confronto { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .confronto.vazio { background: #fafafa; border-style: dashed; color: #aaa; }
    .confronto.decidido { background: #e8f5e9; border-color: #a5d6a7; }
    .lado { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .lado.vencedor { font-weight: 700; color: #2e7d32; }
    .lado .placar { font-weight: 700; font-size: 14px; min-width: 22px; text-align: right; }
    .lado-nome small { display: block; font-size: 10px; color: #999; font-weight: 400; }
    .linha-vs { border-top: 1px solid #eee; margin: 4px 0; }
    .aguardando { font-size: 12px; color: #aaa; font-style: italic; padding: 8px 0; }
    .campeao { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 16px; text-align: center; font-size: 16px; font-weight: 700; color: #f57f17; }
  </style>
</head>
<body>

<div id="app"></div>

<div id="adminModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="app.closeAdminModal()">✕</button>
    <h2>⚙️ Admin</h2>
    <p class="subtitle">Digite a senha para registrar resultados</p>
    <div id="alertContainer"></div>
    <input type="password" id="adminPassword" placeholder="Senha" />
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="app.closeAdminModal()">Cancelar</button>
      <button class="btn-admin-modal" onclick="app.loginAdmin()">Entrar</button>
    </div>
  </div>
</div>

<script>
/* ===================== CONFIG ===================== */

const SENHAS_ADMIN = ['lucaseleticia123', 'tatu123cup'];
const CAMINHO = 'tatucup5';

const GRUPOS = {
  'A': [
    { nome: 'Joao', clube: 'Resort Tambore' },
    { nome: 'Eduardo Mineiro', clube: 'Resort Tambore' },
    { nome: 'Eduardo', clube: 'Valville 1' },
    { nome: 'Marcelinho', clube: 'Resort Tambore' }
  ],
  'B': [
    { nome: 'Lucas Medina', clube: 'Soho' },
    { nome: 'Vinicius', clube: 'Tambore 10' },
    { nome: 'Fernando', clube: 'Eredita' },
    { nome: 'Anderson', clube: 'Boulevard' }
  ],
  'C': [
    { nome: 'Gabriel Santos', clube: 'Soho' },
    { nome: 'Fernando', clube: 'Exclusive House' },
    { nome: 'Gabriel Kenzo', clube: 'Soho' },
    { nome: 'Duarte', clube: 'Boulevard' }
  ],
  'D': [
    { nome: 'Victor', clube: 'Alpha Sitio' },
    { nome: 'Lucas Roris', clube: 'Resort Tambore' },
    { nome: 'Daniel', clube: 'Resort Tambore' },
    { nome: 'Mariana', clube: 'Exclusive House' }
  ]
};

/* ===================== ESTADO ===================== */

let BASE_URL = null;
let DADOS = { matches: [], fase2: null };
let syncStatus = 'ok';

function urlDados() { return BASE_URL.replace(/\/+$/, '') + '/' + CAMINHO + '.json'; }

function gerarJogos(grupo) {
  const players = GRUPOS[grupo];
  const jogos = [];
  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      jogos.push({ p1: players[i].nome, p2: players[j].nome });
    }
  }
  return jogos;
}

function chaveJogo(grupo, p1, p2) { return grupo + '|' + p1 + '|' + p2; }

function normalizar(json) {
  return {
    matches: (json && json.matches) || [],
    fase2: (json && json.fase2) || null
  };
}

/* vencedor de um confronto da fase 2 */
function vencedorDe(c) {
  if (!c || c.s1 == null || c.s2 == null) return null;
  if (c.s1 === c.s2) return null;
  return c.s1 > c.s2 ? c.p1 : c.p2;
}

function nomeCompleto(j) {
  if (!j) return null;
  return j.nome;
}

/* ===================== REDE ===================== */

async function carregarDados() {
  if (!BASE_URL) return false;
  try {
    const r = await fetch(urlDados(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DADOS = normalizar(await r.json());
    setSync('ok');
    return true;
  } catch (e) {
    setSync('erro');
    return false;
  }
}

async function salvarDados() {
  if (!BASE_URL) return false;
  setSync('salvando');
  try {
    const r = await fetch(urlDados(), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DADOS)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSync('ok');
    return true;
  } catch (e) {
    setSync('erro');
    alert('Não foi possível salvar. Verifique a internet e tente de novo.');
    return false;
  }
}

async function testarConexao(base) {
  const url = base.replace(/\/+$/, '') + '/' + CAMINHO + '.json';
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  await r.json();
  return true;
}

function setSync(s) {
  syncStatus = s;
  const el = document.getElementById('syncDot');
  if (!el) return;
  el.className = 'sync-dot ' + (s === 'ok' ? '' : s);
  el.textContent = s === 'ok' ? '● online' : s === 'salvando' ? '● salvando...' : '● sem conexão';
}

/* ===================== SETUP ===================== */

function renderSetup(erro) {
  document.getElementById('app').innerHTML = `
    <div class="setup">
      <h2>🎾 Conectar o banco de dados</h2>
      <p>Faça isto <strong>uma vez só</strong>. Depois é só compartilhar o link gerado.</p>
      <ol>
        <li>Abra <strong>console.firebase.google.com</strong> e entre com sua conta Google.</li>
        <li><strong>Criar projeto</strong> → nome <code>tatu-cup</code> → pode desativar o Analytics.</li>
        <li>Menu da esquerda: <strong>Criar</strong> → <strong>Realtime Database</strong> → <strong>Criar banco de dados</strong>.</li>
        <li>Escolha a localização e marque <strong>Iniciar no modo de teste</strong>.</li>
        <li>Aba <strong>Regras</strong>, deixe assim e clique em <strong>Publicar</strong>:<br>
          <code>{ "rules": { ".read": true, ".write": true } }</code></li>
        <li>Aba <strong>Dados</strong>: copie a URL do topo.</li>
      </ol>
      ${erro ? `<div class="alert-modal alert-error">${erro}</div>` : ''}
      <input type="text" id="baseUrlInput" placeholder="https://tatu-cup-default-rtdb.firebaseio.com" />
      <button class="btn btn-primary" style="width:100%; padding:14px;" onclick="app.conectar()">Conectar</button>
    </div>`;
}

/* ===================== APP ===================== */

function renderApp() {
  const userType = localStorage.getItem('userType') || 'viewer';
  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="header">
        <div>
          <h1>🎾 Tatu Cup 5 — Categoria C</h1>
          <div class="header-info">${userType === 'admin' ? '⚙️ Modo Admin' : '📖 Modo Visualização'}</div>
        </div>
        <div class="header-right">
          <span id="syncDot" class="sync-dot">● online</span>
          <button class="admin-toggle ${userType === 'admin' ? 'active' : ''}" onclick="app.openAdminModal()">⚙️</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-button active" onclick="app.switchTab('grupos', this)">📊 Grupos</button>
        <button class="tab-button" onclick="app.switchTab('jogos', this)">🎾 Jogos</button>
        <button class="tab-button" onclick="app.switchTab('partidas', this)">📋 Partidas</button>
        <button class="tab-button" onclick="app.switchTab('sorteio', this)">🎲 2ª Fase</button>
        <button class="tab-button" onclick="app.switchTab('quadro', this)">🏆 Chave</button>
        <button class="tab-button" onclick="app.switchTab('compartilhar', this)">🔗 Link</button>
      </div>

      <div id="grupos" class="tab-content active"></div>
      <div id="jogos" class="tab-content"></div>
      <div id="partidas" class="tab-content"></div>
      <div id="sorteio" class="tab-content"></div>
      <div id="quadro" class="tab-content"></div>
      <div id="compartilhar" class="tab-content"></div>
    </div>`;
  setSync(syncStatus);
  app.renderAtual();
}

const app = {
  abaAtual: 'grupos',
  selecionados: null,

  /* ---------- setup ---------- */
  async conectar() {
    let base = document.getElementById('baseUrlInput').value.trim();
    if (!base) return;
    if (!/^https?:\/\//.test(base)) base = 'https://' + base;
    base = base.replace(/\/+$/, '');
    try {
      await testarConexao(base);
    } catch (e) {
      renderSetup('Não consegui acessar essa URL. Confira se copiou certo e se publicou as regras.');
      return;
    }
    localStorage.setItem('baseUrl', base);
    location.replace(location.pathname + '?db=' + encodeURIComponent(base));
  },

  /* ---------- admin ---------- */
  openAdminModal() {
    if ((localStorage.getItem('userType') || 'viewer') === 'admin') {
      if (confirm('Sair do modo admin?')) {
        localStorage.setItem('userType', 'viewer');
        renderApp();
      }
      return;
    }
    document.getElementById('adminModal').classList.add('active');
    document.getElementById('adminPassword').focus();
  },

  closeAdminModal() {
    document.getElementById('adminModal').classList.remove('active');
    document.getElementById('adminPassword').value = '';
    document.getElementById('alertContainer').innerHTML = '';
  },

  loginAdmin() {
    const senha = document.getElementById('adminPassword').value;
    if (!SENHAS_ADMIN.includes(senha)) {
      document.getElementById('alertContainer').innerHTML = '<div class="alert-modal alert-error">⚠️ Senha incorreta</div>';
      return;
    }
    localStorage.setItem('userType', 'admin');
    this.closeAdminModal();
    renderApp();
  },

  isAdmin() { return (localStorage.getItem('userType') || 'viewer') === 'admin'; },

  /* ---------- navegação ---------- */
  switchTab(tab, btn) {
    this.abaAtual = tab;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    if (btn) btn.classList.add('active');
    this.renderAtual();
  },

  renderAtual() {
    const t = this.abaAtual;
    if (t === 'grupos') this.renderGrupos();
    if (t === 'jogos') this.renderJogos();
    if (t === 'partidas') this.renderPartidas();
    if (t === 'sorteio') this.renderSorteio();
    if (t === 'quadro') this.renderQuadro();
    if (t === 'compartilhar') this.renderCompartilhar();
  },

  /* ---------- ranking ---------- */
  calcRanking(grupo) {
    const stats = {};
    GRUPOS[grupo].forEach(p => {
      stats[p.nome] = { ...p, grupo, wins: 0, points: 0, setsGanhos: 0, setsPerdidos: 0 };
    });

    DADOS.matches.filter(m => m.grupo === grupo).forEach(m => {
      if (!stats[m.player1] || !stats[m.player2]) return;
      const s1 = m.scoreP1 || 0, s2 = m.scoreP2 || 0;
      stats[m.player1].setsGanhos += s1;
      stats[m.player1].setsPerdidos += s2;
      stats[m.player2].setsGanhos += s2;
      stats[m.player2].setsPerdidos += s1;
      if (s1 > s2) { stats[m.player1].wins++; stats[m.player1].points += 3; }
      else if (s2 > s1) { stats[m.player2].wins++; stats[m.player2].points += 3; }
    });

    return Object.values(stats).sort((a, b) =>
      b.points - a.points ||
      (b.setsGanhos - b.setsPerdidos) - (a.setsGanhos - a.setsPerdidos) ||
      b.setsGanhos - a.setsGanhos
    );
  },

  renderGrupos() {
    let html = '<div class="grupos-grid">';
    Object.keys(GRUPOS).forEach(grupo => {
      const ranking = this.calcRanking(grupo);
      html += `
        <div class="grupo-card">
          <div class="grupo-header"><span class="grupo-badge">GRUPO ${grupo}</span></div>
          <table class="ranking-table">
            <thead><tr><th>Pos</th><th>Jogador</th><th>V</th><th>Pts</th><th>SG</th><th>SP</th><th>Saldo</th></tr></thead>
            <tbody>
              ${ranking.map((p, i) => {
                const saldo = p.setsGanhos - p.setsPerdidos;
                const cls = saldo > 0 ? 'stat-positivo' : saldo < 0 ? 'stat-negativo' : 'stat-neutro';
                return `<tr class="${i < 2 ? 'classificado' : ''}">
                  <td style="font-weight:600;color:#007AFF;">${i + 1}</td>
                  <td><p class="player-nome">${p.nome}</p><p class="player-clube">${p.clube || '-'}</p></td>
                  <td>${p.wins}</td>
                  <td style="font-weight:600;color:#4caf50;">${p.points}</td>
                  <td class="stat-positivo">${p.setsGanhos}</td>
                  <td class="stat-negativo">${p.setsPerdidos}</td>
                  <td class="${cls}">${saldo > 0 ? '+' : ''}${saldo}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    });
    html += '</div>';
    document.getElementById('grupos').innerHTML = html;
  },

  /* ---------- jogos ---------- */
  renderJogos() {
    const isAdmin = this.isAdmin();
    let html = '';

    Object.keys(GRUPOS).forEach(grupo => {
      const jogos = gerarJogos(grupo);
      html += `<div class="jogo-grupo"><h3><span class="grupo-badge">GRUPO ${grupo}</span> &nbsp;${jogos.length} partidas</h3><div class="rodada-games">`;

      jogos.forEach(jogo => {
        const m = DADOS.matches.find(x => x.grupo === grupo && x.player1 === jogo.p1 && x.player2 === jogo.p2);
        const played = !!m;
        const k = chaveJogo(grupo, jogo.p1, jogo.p2);

        html += `
          <div class="jogo-placar ${played ? 'played' : ''}" data-k="${k}">
            ${played ? '<span class="jogo-status">✓ Disputado</span>' : ''}
            <div class="placar-container">
              <div class="placar-jogador">
                <div class="placar-jogador-nome">${jogo.p1}</div>
                <input type="number" inputmode="numeric" class="placar-input placar-p1" value="${played ? m.scoreP1 : ''}" placeholder="0" ${isAdmin ? '' : 'disabled'} min="0" />
              </div>
              <div class="placar-vs-texto">x</div>
              <div class="placar-jogador">
                <div class="placar-jogador-nome">${jogo.p2}</div>
                <input type="number" inputmode="numeric" class="placar-input placar-p2" value="${played ? m.scoreP2 : ''}" placeholder="0" ${isAdmin ? '' : 'disabled'} min="0" />
              </div>
            </div>
            ${isAdmin ? `<div class="jogo-acoes">
              <button class="btn btn-primary" style="flex:1;" onclick="app.salvarResultado('${grupo}','${jogo.p1}','${jogo.p2}')">${played ? 'Atualizar' : 'Registrar'}</button>
              ${played ? `<button class="btn btn-danger" onclick="app.deletarResultado('${grupo}','${jogo.p1}','${jogo.p2}')">Apagar</button>` : ''}
            </div>` : ''}
          </div>`;
      });

      html += '</div></div>';
    });

    document.getElementById('jogos').innerHTML = html;
  },

  async salvarResultado(grupo, p1, p2) {
    const card = document.querySelector(`[data-k="${chaveJogo(grupo, p1, p2)}"]`);
    const s1 = parseInt(card.querySelector('.placar-p1').value);
    const s2 = parseInt(card.querySelector('.placar-p2').value);
    if (isNaN(s1) || isNaN(s2)) { alert('Preencha os dois placares.'); return; }
    if (s1 === s2) { alert('O placar não pode empatar.'); return; }

    await carregarDados();
    const i = DADOS.matches.findIndex(m => m.grupo === grupo && m.player1 === p1 && m.player2 === p2);
    const novo = { grupo, player1: p1, player2: p2, scoreP1: s1, scoreP2: s2, winner: s1 > s2 ? 'player1' : 'player2' };
    if (i >= 0) DADOS.matches[i] = novo; else DADOS.matches.push(novo);
    await salvarDados();
    this.renderAtual();
  },

  async deletarResultado(grupo, p1, p2) {
    if (!confirm('Apagar este resultado?')) return;
    await carregarDados();
    DADOS.matches = DADOS.matches.filter(m => !(m.grupo === grupo && m.player1 === p1 && m.player2 === p2));
    await salvarDados();
    this.renderAtual();
  },

  /* ---------- partidas ---------- */
  renderPartidas() {
    const isAdmin = this.isAdmin();
    const ms = DADOS.matches;
    document.getElementById('partidas').innerHTML = `
      <div class="section-card">
        <h3>📋 Histórico (${ms.length} partidas)</h3>
        ${ms.length === 0 ? '<p style="color:#999;text-align:center;padding:20px;">Nenhuma partida registrada</p>' :
          ms.map(m => `
            <div style="padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:12px;">
              <div>
                <span style="background:#e3f2fd;color:#007AFF;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;">Grupo ${m.grupo}</span>
                <div style="margin-top:6px;font-size:13px;"><strong>${m.player1}</strong> ${m.scoreP1} x ${m.scoreP2} <strong>${m.player2}</strong></div>
              </div>
              ${isAdmin ? `<button class="btn btn-danger" onclick="app.deletarResultado('${m.grupo}','${m.player1}','${m.player2}')">Apagar</button>` : ''}
            </div>`).join('')}
      </div>`;
  },

  /* ---------- 2ª fase: seleção e sorteio ---------- */
  classificadosPadrao() {
    const out = [];
    Object.keys(GRUPOS).forEach(g => {
      this.calcRanking(g).slice(0, 2).forEach(p => out.push({ nome: p.nome, clube: p.clube, grupo: g }));
    });
    return out;
  },

  idJogador(j) { return j.grupo + '|' + j.nome; },

  renderSorteio() {
    const isAdmin = this.isAdmin();
    const f2 = DADOS.fase2;
    let html = '';

    if (f2) {
      html = `<div class="section-card">
        <h3>✓ Grupos da 2ª fase definidos</h3>
        <div class="fase2-grupos">
          ${f2.grupos.map((g, gi) => `
            <div class="fase2-grupo">
              <h4><span class="${gi === 0 ? 'badge-g1' : 'badge-g2'}">GRUPO ${gi + 1}</span></h4>
              ${g.confrontos.map((c, ci) => `
                <div style="padding:8px 0;border-bottom:1px solid #eee;font-size:13px;">
                  <strong>Confronto ${ci + 1}</strong><br>
                  ${c.p1.nome} <span style="color:#999;">x</span> ${c.p2.nome}
                </div>`).join('')}
              <p style="font-size:12px;color:#666;margin-top:10px;">Os dois vencedores fazem a Semifinal ${gi + 1}.</p>
            </div>`).join('')}
        </div>
        <p style="font-size:13px;color:#666;margin-top:16px;">Os placares são registrados na aba <strong>🏆 Chave</strong>.</p>
        ${isAdmin ? '<button class="btn btn-danger" style="margin-top:8px;" onclick="app.resetarFase2()">Refazer sorteio da 2ª fase</button>' : ''}
      </div>`;
    } else if (isAdmin) {
      if (!this.selecionados) this.selecionados = this.classificadosPadrao().map(j => this.idJogador(j));

      html = `<div class="section-card">
        <h3>🎲 Sorteio da 2ª fase</h3>
        <p style="color:#666;font-size:13px;line-height:1.5;">Os dois primeiros de cada grupo já vêm marcados automaticamente. Toque para ajustar se houver empate ou desistência. Selecionados: <strong>${this.selecionados.length}/8</strong></p>
        <div class="sorteio-cols">`;

      Object.keys(GRUPOS).forEach(grupo => {
        html += `<div><div style="font-size:12px;color:#999;margin-bottom:8px;font-weight:600;">Grupo ${grupo}</div>`;
        this.calcRanking(grupo).forEach((p, i) => {
          const id = grupo + '|' + p.nome;
          const sel = this.selecionados.includes(id);
          html += `<div class="sorteio-item ${sel ? 'selected' : ''}" onclick="app.toggleClassificado('${grupo}','${p.nome.replace(/'/g, "\\'")}')">
            <div class="sorteio-item-name">${i + 1}º ${p.nome}</div>
            <div class="sorteio-item-pts">${p.points} pts • saldo ${p.setsGanhos - p.setsPerdidos}</div>
          </div>`;
        });
        html += '</div>';
      });

      html += `</div>
        <button class="btn btn-primary" style="margin-top:16px;width:100%;padding:14px;" onclick="app.sortearFase2()">Sortear os 2 grupos</button>
        <p style="font-size:12px;color:#999;margin-top:10px;">O sistema embaralha os 8 e monta os dois grupos de 4, já definindo os confrontos.</p>
      </div>`;
    } else {
      html = '<div class="section-card"><p style="color:#999;text-align:center;padding:20px;">A 2ª fase começa quando a fase de grupos terminar.</p></div>';
    }

    document.getElementById('sorteio').innerHTML = html;
  },

  toggleClassificado(grupo, nome) {
    const id = grupo + '|' + nome;
    const i = this.selecionados.indexOf(id);
    if (i >= 0) this.selecionados.splice(i, 1);
    else if (this.selecionados.length < 8) this.selecionados.push(id);
    else { alert('Já são 8 selecionados. Desmarque alguém antes.'); return; }
    this.renderSorteio();
  },

  async sortearFase2() {
    if (this.selecionados.length !== 8) { alert('Selecione exatamente 8 jogadores.'); return; }
    if (!confirm('Sortear os grupos da 2ª fase? Isso define os confrontos.')) return;

    // monta objetos completos
    const lista = this.selecionados.map(id => {
      const [g, nome] = id.split('|');
      const p = GRUPOS[g].find(x => x.nome === nome);
      return { nome, clube: p ? p.clube : '', grupo: g };
    });

    // embaralha (Fisher-Yates)
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }

    const fase2 = {
      grupos: [
        { confrontos: [
          { p1: lista[0], p2: lista[1], s1: null, s2: null },
          { p1: lista[2], p2: lista[3], s1: null, s2: null }
        ]},
        { confrontos: [
          { p1: lista[4], p2: lista[5], s1: null, s2: null },
          { p1: lista[6], p2: lista[7], s1: null, s2: null }
        ]}
      ],
      semis: [ { s1: null, s2: null }, { s1: null, s2: null } ],
      final: { s1: null, s2: null }
    };

    await carregarDados();
    DADOS.fase2 = fase2;
    await salvarDados();
    this.selecionados = null;
    this.renderAtual();
  },

  async resetarFase2() {
    if (!confirm('Refazer o sorteio? Todos os resultados da 2ª fase, semifinais e final serão apagados.')) return;
    await carregarDados();
    DADOS.fase2 = null;
    await salvarDados();
    this.selecionados = null;
    this.renderAtual();
  },

  /* ---------- chave ---------- */
  semifinalistas(gi) {
    const g = DADOS.fase2.grupos[gi];
    return { p1: vencedorDe(g.confrontos[0]), p2: vencedorDe(g.confrontos[1]) };
  },

  finalistas() {
    const f2 = DADOS.fase2;
    const out = [];
    for (let i = 0; i < 2; i++) {
      const sf = this.semifinalistas(i);
      const s = f2.semis[i];
      if (!sf.p1 || !sf.p2) { out.push(null); continue; }
      out.push(vencedorDe({ p1: sf.p1, p2: sf.p2, s1: s.s1, s2: s.s2 }));
    }
    return out;
  },

  campeao() {
    const f = this.finalistas();
    if (!f[0] || !f[1]) return null;
    return vencedorDe({ p1: f[0], p2: f[1], s1: DADOS.fase2.final.s1, s2: DADOS.fase2.final.s2 });
  },

  boxConfronto(key, p1, p2, s1, s2, rotulo) {
    const isAdmin = this.isAdmin();
    if (!p1 || !p2) {
      return `<div class="confronto vazio">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">${rotulo}</div>
        <div class="aguardando">Aguardando os resultados anteriores</div>
      </div>`;
    }
    const venc = vencedorDe({ p1, p2, s1, s2 });
    const decidido = !!venc;

    return `<div class="confronto ${decidido ? 'decidido' : ''}" data-c="${key}">
      <div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">${rotulo}</div>
      <div class="lado ${venc === p1 ? 'vencedor' : ''}">
        <span class="lado-nome">${p1.nome}<small>${p1.clube || ''}</small></span>
        <span class="placar">${s1 == null ? '–' : s1}</span>
      </div>
      <div class="linha-vs"></div>
      <div class="lado ${venc === p2 ? 'vencedor' : ''}">
        <span class="lado-nome">${p2.nome}<small>${p2.clube || ''}</small></span>
        <span class="placar">${s2 == null ? '–' : s2}</span>
      </div>
      ${isAdmin ? `
        <div class="placar-container" style="margin-top:10px;">
          <input type="number" inputmode="numeric" class="placar-input c-s1" value="${s1 == null ? '' : s1}" placeholder="0" min="0" />
          <div class="placar-vs-texto">x</div>
          <input type="number" inputmode="numeric" class="placar-input c-s2" value="${s2 == null ? '' : s2}" placeholder="0" min="0" />
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="app.salvarConfronto('${key}')">${decidido ? 'Atualizar' : 'Registrar'}</button>
      ` : ''}
    </div>`;
  },

  renderQuadro() {
    const f2 = DADOS.fase2;
    const el = document.getElementById('quadro');

    if (!f2) {
      el.innerHTML = `<div class="section-card">
        <h3>🏆 Chave da 2ª fase</h3>
        <p style="color:#666;font-size:14px;line-height:1.6;">A chave aparece aqui assim que a fase de grupos terminar e o sorteio for feito na aba <strong>🎲 2ª Fase</strong>.</p>
        <div class="chave" style="margin-top:16px;opacity:0.55;">
          <div class="chave-col">
            <div class="chave-titulo">Grupo 1</div>
            ${this.boxConfronto('x', null, null, null, null, 'Confronto 1')}
            ${this.boxConfronto('x', null, null, null, null, 'Confronto 2')}
            <div class="chave-titulo" style="margin-top:16px;">Grupo 2</div>
            ${this.boxConfronto('x', null, null, null, null, 'Confronto 3')}
            ${this.boxConfronto('x', null, null, null, null, 'Confronto 4')}
          </div>
          <div class="chave-col">
            <div class="chave-titulo">Semifinais</div>
            ${this.boxConfronto('x', null, null, null, null, 'Semifinal 1')}
            ${this.boxConfronto('x', null, null, null, null, 'Semifinal 2')}
          </div>
          <div class="chave-col">
            <div class="chave-titulo">Final</div>
            ${this.boxConfronto('x', null, null, null, null, 'Final')}
          </div>
        </div>
      </div>`;
      return;
    }

    const sf0 = this.semifinalistas(0);
    const sf1 = this.semifinalistas(1);
    const fin = this.finalistas();
    const camp = this.campeao();

    el.innerHTML = `
      <div class="chave">
        <div class="chave-col">
          <div class="chave-titulo"><span class="badge-g1">GRUPO 1</span></div>
          ${this.boxConfronto('g0c0', f2.grupos[0].confrontos[0].p1, f2.grupos[0].confrontos[0].p2, f2.grupos[0].confrontos[0].s1, f2.grupos[0].confrontos[0].s2, 'Confronto 1')}
          ${this.boxConfronto('g0c1', f2.grupos[0].confrontos[1].p1, f2.grupos[0].confrontos[1].p2, f2.grupos[0].confrontos[1].s1, f2.grupos[0].confrontos[1].s2, 'Confronto 2')}
          <div class="chave-titulo" style="margin-top:20px;"><span class="badge-g2">GRUPO 2</span></div>
          ${this.boxConfronto('g1c0', f2.grupos[1].confrontos[0].p1, f2.grupos[1].confrontos[0].p2, f2.grupos[1].confrontos[0].s1, f2.grupos[1].confrontos[0].s2, 'Confronto 3')}
          ${this.boxConfronto('g1c1', f2.grupos[1].confrontos[1].p1, f2.grupos[1].confrontos[1].p2, f2.grupos[1].confrontos[1].s1, f2.grupos[1].confrontos[1].s2, 'Confronto 4')}
        </div>

        <div class="chave-col">
          <div class="chave-titulo">Semifinais</div>
          ${this.boxConfronto('sf0', sf0.p1, sf0.p2, f2.semis[0].s1, f2.semis[0].s2, 'Semifinal 1 — Grupo 1')}
          ${this.boxConfronto('sf1', sf1.p1, sf1.p2, f2.semis[1].s1, f2.semis[1].s2, 'Semifinal 2 — Grupo 2')}
        </div>

        <div class="chave-col">
          <div class="chave-titulo">Final</div>
          ${this.boxConfronto('fin', fin[0], fin[1], f2.final.s1, f2.final.s2, 'Final')}
          ${camp ? `<div class="campeao">🏆 ${camp.nome}<div style="font-size:12px;font-weight:400;color:#a1887f;margin-top:4px;">${camp.clube || ''}</div></div>` : ''}
        </div>
      </div>`;
  },

  async salvarConfronto(key) {
    const card = document.querySelector(`[data-c="${key}"]`);
    const s1 = parseInt(card.querySelector('.c-s1').value);
    const s2 = parseInt(card.querySelector('.c-s2').value);
    if (isNaN(s1) || isNaN(s2)) { alert('Preencha os dois placares.'); return; }
    if (s1 === s2) { alert('O placar não pode empatar.'); return; }

    await carregarDados();
    const f2 = DADOS.fase2;
    if (!f2) { alert('O sorteio da 2ª fase ainda não foi feito.'); return; }

    if (key === 'sf0') { f2.semis[0].s1 = s1; f2.semis[0].s2 = s2; }
    else if (key === 'sf1') { f2.semis[1].s1 = s1; f2.semis[1].s2 = s2; }
    else if (key === 'fin') { f2.final.s1 = s1; f2.final.s2 = s2; }
    else {
      const gi = parseInt(key[1]), ci = parseInt(key[3]);
      const antes = vencedorDe(f2.grupos[gi].confrontos[ci]);
      f2.grupos[gi].confrontos[ci].s1 = s1;
      f2.grupos[gi].confrontos[ci].s2 = s2;
      const depois = vencedorDe(f2.grupos[gi].confrontos[ci]);
      // se trocou o vencedor, limpa a semifinal e a final afetadas
      if (antes && depois && antes.nome !== depois.nome) {
        f2.semis[gi] = { s1: null, s2: null };
        f2.final = { s1: null, s2: null };
      }
    }

    await salvarDados();
    this.renderAtual();
  },

  /* ---------- compartilhar ---------- */
  renderCompartilhar() {
    document.getElementById('compartilhar').innerHTML = `
      <div class="section-card">
        <h3>🔗 Link do campeonato</h3>
        <p style="color:#555;font-size:14px;line-height:1.5;">Compartilhe exatamente este link. Ele já vem com o endereço do banco.</p>
        <div class="link-box">${location.href}</div>
        <button class="btn btn-primary" style="margin-top:12px;" onclick="app.copiarLink()">Copiar link</button>
      </div>`;
  },

  copiarLink() {
    navigator.clipboard.writeText(location.href)
      .then(() => alert('Link copiado!'))
      .catch(() => alert('Copie manualmente: ' + location.href));
  }
};

window.app = app;

/* ===================== INICIALIZAÇÃO ===================== */

(async function init() {
  const p = new URLSearchParams(location.search);
  BASE_URL = p.get('db') || localStorage.getItem('baseUrl');

  if (!BASE_URL) { renderSetup(); return; }

  if (!p.get('db')) history.replaceState(null, '', location.pathname + '?db=' + encodeURIComponent(BASE_URL));
  localStorage.setItem('baseUrl', BASE_URL);
  if (!localStorage.getItem('userType')) localStorage.setItem('userType', 'viewer');

  await carregarDados();
  renderApp();

  setInterval(async () => {
    const el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) return;
    if (document.getElementById('adminModal').classList.contains('active')) return;
    const antes = JSON.stringify(DADOS);
    await carregarDados();
    if (JSON.stringify(DADOS) !== antes) app.renderAtual();
  }, 8000);

  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    await carregarDados();
    app.renderAtual();
  });
})();
</script>

</body>
</html>
