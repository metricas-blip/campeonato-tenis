<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎾 Tatu Cup 5 — Categoria C</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; color: #333; }

    .container { max-width: 1000px; margin: 0 auto; padding: 16px; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: white; border-radius: 12px; padding: 32px; width: 100%; max-width: 400px; position: relative; }
    .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
    .modal h2 { margin: 0 0 8px 0; font-size: 22px; text-align: center; }
    .modal .subtitle { text-align: center; color: #666; margin: 0 0 20px 0; font-size: 13px; }
    .modal input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; margin-bottom: 12px; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-admin-modal { background: #007AFF; color: white; }
    .btn-cancel { background: #f0f0f0; border: 1px solid #ddd; }
    .alert-modal { margin-bottom: 12px; padding: 10px; border-radius: 6px; font-size: 13px; }
    .alert-error { background: #ffebee; color: #c62828; }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    .alert-warn { background: #fff8e1; color: #8d6e00; border: 1px solid #ffe082; }

    /* Setup */
    .setup { max-width: 620px; margin: 30px auto; background: white; border: 1px solid #ddd; border-radius: 12px; padding: 28px; }
    .setup h2 { margin: 0 0 12px 0; font-size: 20px; }
    .setup p, .setup li { color: #555; font-size: 14px; line-height: 1.6; }
    .setup ol { padding-left: 20px; }
    .setup input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; margin: 12px 0; }
    .setup code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .link-box { background: #f0f7ff; border: 1px solid #b6d9ff; border-radius: 8px; padding: 12px; font-size: 12px; word-break: break-all; margin-top: 12px; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #ddd; padding-bottom: 12px; gap: 12px; }
    .header h1 { margin: 0; font-size: 20px; }
    .header-info { font-size: 12px; color: #666; margin-top: 4px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .sync-dot { font-size: 11px; color: #4caf50; white-space: nowrap; }
    .sync-dot.erro { color: #f44336; }

    .admin-toggle { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 16px; color: #999; }
    .admin-toggle.active { background: #e3f2fd; border-color: #007AFF; color: #007AFF; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid #ddd; overflow-x: auto; }
    .tab-button { padding: 12px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; color: #999; font-size: 13px; white-space: nowrap; }
    .tab-button.active { color: #333; border-bottom-color: #007AFF; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section-card h3 { margin: 0 0 14px 0; font-size: 16px; }

    /* Grupos */
    .grupos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .grupo-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 14px; }
    .grupo-badge { background: #007AFF; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .grupo-header { margin-bottom: 12px; }

    .ranking-table { width: 100%; border-collapse: collapse; }
    .ranking-table th { padding: 8px 4px; border-bottom: 1px solid #ddd; color: #999; font-weight: 600; font-size: 10px; text-transform: uppercase; text-align: center; }
    .ranking-table th:nth-child(2) { text-align: left; }
    .ranking-table td { padding: 8px 4px; border-bottom: 1px solid #eee; font-size: 12px; text-align: center; }
    .ranking-table td:nth-child(2) { text-align: left; }
    .ranking-table tr.classificado td { background: #f1f8f2; }
    .player-nome { font-weight: 500; font-size: 13px; margin: 0; }
    .player-clube { font-size: 10px; color: #999; margin: 2px 0 0 0; }
    .stat-positivo { color: #4caf50; font-weight: 600; }
    .stat-negativo { color: #f44336; }
    .stat-neutro { color: #333; }

    /* Jogos */
    .jogo-grupo { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .jogo-grupo h3 { margin: 0 0 14px 0; font-size: 15px; }
    .rodada-games { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    .jogo-placar { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .jogo-placar.played { background: #e8f5e9; border-color: #a5d6a7; }
    .jogo-status { font-size: 11px; font-weight: 600; color: #4caf50; display: block; margin-bottom: 8px; }
    .placar-container { display: flex; align-items: flex-end; gap: 8px; }
    .placar-jogador { flex: 1; min-width: 0; }
    .placar-jogador-nome { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .placar-jogador-clube { font-size: 10px; color: #999; margin-bottom: 6px; }
    .placar-input { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; font-weight: 600; text-align: center; }
    .placar-input:focus { border-color: #007AFF; outline: none; }
    .placar-input:disabled { background: #f0f0f0; color: #333; }
    .placar-vs-texto { font-size: 12px; color: #999; padding-bottom: 12px; }
    .jogo-acoes { display: flex; gap: 8px; margin-top: 10px; }

    .btn { padding: 10px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; }
    .btn-primary { background: #007AFF; color: white; }
    .btn-secondary { background: #f0f0f0; border: 1px solid #ddd; }
    .btn-danger { background: #ffebee; color: #f44336; border: 1px solid #ffcdd2; }

    /* Sorteio / definição dos classificados */
    .sorteio-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .sorteio-grupo { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .sorteio-grupo h4 { margin: 0 0 10px 0; font-size: 13px; }
    .sorteio-label { font-size: 11px; color: #999; font-weight: 600; text-transform: uppercase; display: block; margin-bottom: 4px; }
    .sorteio-select { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; margin-bottom: 10px; }
    .sorteio-select.seed { border-color: #007AFF; font-weight: 600; }
    .ranking-mini { font-size: 11px; color: #999; line-height: 1.5; margin: 6px 0 0 0; }
    .check-linha { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; font-size: 13px; color: #555; }
    .check-linha input { margin-top: 2px; }

    .badge-seed { background: #007AFF; color: white; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; }
    .badge-dois { background: #eee; color: #777; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; }

    /* Chave */
    .formato-aviso { background: #f0f7ff; border: 1px solid #b6d9ff; border-radius: 8px; padding: 12px; font-size: 12px; color: #31557a; line-height: 1.6; margin-bottom: 16px; }
    .chave { display: flex; gap: 16px; overflow-x: auto; padding: 4px 0 12px 0; }
    .chave-col { min-width: 260px; flex: 1; }
    .chave-titulo { font-weight: 600; font-size: 12px; color: #999; margin-bottom: 12px; text-transform: uppercase; }
    .confronto { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .confronto.vazio { background: #fafafa; border-style: dashed; color: #aaa; }
    .confronto.decidido { background: #e8f5e9; border-color: #a5d6a7; }
    .confronto-rotulo { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .lado { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .lado.vencedor { font-weight: 700; color: #2e7d32; }
    .lado .placar { font-weight: 700; font-size: 14px; min-width: 22px; text-align: right; }
    .lado-nome small { display: block; font-size: 10px; color: #999; font-weight: 400; }
    .linha-vs { border-top: 1px solid #eee; margin: 4px 0; }
    .aguardando { font-size: 12px; color: #aaa; font-style: italic; padding: 8px 0; }
    .campeao { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 16px; text-align: center; font-size: 16px; font-weight: 700; color: #f57f17; }

    /* Sets (semis e final) */
    .sets-head { display: flex; gap: 6px; font-size: 10px; color: #999; text-transform: uppercase; justify-content: flex-end; margin-bottom: 2px; }
    .sets-head span { width: 28px; text-align: center; }
    .sets-placar { display: flex; gap: 6px; }
    .sets-placar span { width: 28px; text-align: center; font-weight: 700; font-size: 14px; }
    .sets-total { min-width: 26px; text-align: right; font-weight: 700; font-size: 14px; color: #2e7d32; }
    .set-edit { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .set-edit label { font-size: 11px; color: #999; width: 44px; }
    .set-edit input { flex: 1; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 15px; font-weight: 600; text-align: center; min-width: 0; }
    .set-edit input:focus { border-color: #007AFF; outline: none; }
    .set-edit .x { font-size: 11px; color: #bbb; }
  </style>
</head>
<body>

<div id="app"></div>

<div id="adminModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="app.closeAdminModal()">✕</button>
    <h2>⚙️ Admin</h2>
    <p class="subtitle">Digite a senha para registrar resultados</p>
    <div id="alertContainer"></div>
    <input type="password" id="adminPassword" placeholder="Senha" />
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="app.closeAdminModal()">Cancelar</button>
      <button class="btn-admin-modal" onclick="app.loginAdmin()">Entrar</button>
    </div>
  </div>
</div>

<script>
/* ===================== CONFIG ===================== */

const SENHAS_ADMIN = ['lucaseleticia123', 'tatu123cup'];
const CAMINHO = 'tatucup5';

/* versão do formato da 2ª fase gravado no banco.
   Mudou de "2 grupos de 4" para "quartas com cabeça de chave". */
const FORMATO_FASE2 = 2;

/* quartas: quem chega primeiro a esta pontuação vence */
const PONTOS_QUARTAS = 10;

/* semis e final: melhor de N sets */
const SETS_SERIE = 3;          /* melhor de 3 */
const SETS_PARA_VENCER = 2;    /* precisa levar 2 sets */
const GAMES_SET = 6;           /* set vai até 6 games */

const GRUPOS = {
  'A': [
    { nome: 'Joao', clube: 'Resort Tambore' },
    { nome: 'Eduardo Mineiro', clube: 'Resort Tambore' },
    { nome: 'Eduardo', clube: 'Valville 1' },
    { nome: 'Marcelinho', clube: 'Resort Tambore' }
  ],
  'B': [
    { nome: 'Lucas Medina', clube: 'Soho' },
    { nome: 'Vinicius', clube: 'Tambore 10' },
    { nome: 'Fernando', clube: 'Eredita' },
    { nome: 'Anderson', clube: 'Boulevard' }
  ],
  'C': [
    { nome: 'Gabriel Santos', clube: 'Soho' },
    { nome: 'Fernando', clube: 'Exclusive House' },
    { nome: 'Gabriel Kenzo', clube: 'Soho' },
    { nome: 'Duarte', clube: 'Boulevard' }
  ],
  'D': [
    { nome: 'Victor', clube: 'Alpha Sitio' },
    { nome: 'Lucas Roris', clube: 'Resort Tambore' },
    { nome: 'Daniel', clube: 'Resort Tambore' },
    { nome: 'Mariana', clube: 'Exclusive House' }
  ]
};

const LETRAS = Object.keys(GRUPOS);

/* ===================== ESTADO ===================== */

let BASE_URL = null;
let DADOS = { matches: [], fase2: null, fase2Legado: false };
let syncStatus = 'ok';

function urlDados() { return BASE_URL.replace(/\/+$/, '') + '/' + CAMINHO + '.json'; }

function gerarJogos(grupo) {
  const players = GRUPOS[grupo];
  const jogos = [];
  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      jogos.push({ p1: players[i].nome, p2: players[j].nome });
    }
  }
  return jogos;
}

function chaveJogo(grupo, p1, p2) { return grupo + '|' + p1 + '|' + p2; }

/* ---- normalização do que vem do banco ---------------------------------
   O Firebase remove chaves com valor null, então tudo que for opcional
   precisa ser reconstruído aqui com um default seguro. */
function completarFase2(f2) {
  const quartas = [];
  for (let i = 0; i < 4; i++) {
    const c = (f2.quartas && f2.quartas[i]) || {};
    quartas.push({
      p1: c.p1 || null,
      p2: c.p2 || null,
      s1: c.s1 == null ? null : c.s1,
      s2: c.s2 == null ? null : c.s2
    });
  }
  const semis = [0, 1].map(i => ({
    sets: ((f2.semis && f2.semis[i] && f2.semis[i].sets) || []).filter(Boolean)
  }));
  const final = { sets: ((f2.final && f2.final.sets) || []).filter(Boolean) };
  return { versao: FORMATO_FASE2, quartas, semis, final };
}

function normalizar(json) {
  const bruto = json && json.fase2;
  const valido = bruto && bruto.versao === FORMATO_FASE2;
  return {
    matches: (json && json.matches) || [],
    fase2: valido ? completarFase2(bruto) : null,
    fase2Legado: !!(bruto && !valido)
  };
}

/* ---- vencedores -------------------------------------------------------- */

/* quartas: pontos corridos */
function vencedorPontos(c) {
  if (!c || !c.p1 || !c.p2) return null;
  if (c.s1 == null || c.s2 == null) return null;
  if (c.s1 === c.s2) return null;
  return c.s1 > c.s2 ? c.p1 : c.p2;
}

/* semis e final: melhor de 3 sets */
function contarSets(sets) {
  let a = 0, b = 0;
  (sets || []).forEach(s => {
    if (!s || s.g1 == null || s.g2 == null) return;
    if (s.g1 > s.g2) a++; else if (s.g2 > s.g1) b++;
  });
  return { a, b };
}

function vencedorSerie(c) {
  if (!c || !c.p1 || !c.p2) return null;
  const { a, b } = contarSets(c.sets);
  if (a >= SETS_PARA_VENCER && a > b) return c.p1;
  if (b >= SETS_PARA_VENCER && b > a) return c.p2;
  return null;
}

function mesmoJogador(x, y) {
  if (!x || !y) return false;
  return x.nome === y.nome && x.grupo === y.grupo;
}

/* valida um set isolado. Retorna null se ok, ou a mensagem de erro. */
function validarSet(g1, g2) {
  if (g1 < 0 || g2 < 0) return 'games não podem ser negativos';
  if (g1 === g2) return 'um set não termina empatado';
  const max = Math.max(g1, g2), min = Math.min(g1, g2);
  if (max < GAMES_SET) return 'o set só fecha com pelo menos ' + GAMES_SET + ' games';
  if (max === GAMES_SET && min > GAMES_SET - 2) return GAMES_SET + '-' + min + ' não fecha o set (precisa de 2 games de vantagem)';
  if (max === GAMES_SET + 1 && min < GAMES_SET - 1) return 'com ' + (GAMES_SET + 1) + ' games o placar só pode ser ' + (GAMES_SET + 1) + '-' + (GAMES_SET - 1) + ' ou ' + (GAMES_SET + 1) + '-' + GAMES_SET;
  return null;
}

/* ===================== REDE ===================== */

async function carregarDados() {
  if (!BASE_URL) return false;
  try {
    const r = await fetch(urlDados(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DADOS = normalizar(await r.json());
    setSync('ok');
    return true;
  } catch (e) {
    setSync('erro');
    return false;
  }
}

async function salvarDados() {
  if (!BASE_URL) return false;
  setSync('salvando');
  try {
    const r = await fetch(urlDados(), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matches: DADOS.matches, fase2: DADOS.fase2 })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSync('ok');
    return true;
  } catch (e) {
    setSync('erro');
    alert('Não foi possível salvar. Verifique a internet e tente de novo.');
    return false;
  }
}

async function testarConexao(base) {
  const url = base.replace(/\/+$/, '') + '/' + CAMINHO + '.json';
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  await r.json();
  return true;
}

function setSync(s) {
  syncStatus = s;
  const el = document.getElementById('syncDot');
  if (!el) return;
  el.className = 'sync-dot ' + (s === 'ok' ? '' : s);
  el.textContent = s === 'ok' ? '● online' : s === 'salvando' ? '● salvando...' : '● sem conexão';
}

/* ===================== SETUP ===================== */

function renderSetup(erro) {
  document.getElementById('app').innerHTML = `
    <div class="setup">
      <h2>🎾 Conectar o banco de dados</h2>
      <p>Faça isto <strong>uma vez só</strong>. Depois é só compartilhar o link gerado.</p>
      <ol>
        <li>Abra <strong>console.firebase.google.com</strong> e entre com sua conta Google.</li>
        <li><strong>Criar projeto</strong> → nome <code>tatu-cup</code> → pode desativar o Analytics.</li>
        <li>Menu da esquerda: <strong>Criar</strong> → <strong>Realtime Database</strong> → <strong>Criar banco de dados</strong>.</li>
        <li>Escolha a localização e marque <strong>Iniciar no modo de teste</strong>.</li>
        <li>Aba <strong>Regras</strong>, deixe assim e clique em <strong>Publicar</strong>:<br>
          <code>{ "rules": { ".read": true, ".write": true } }</code></li>
        <li>Aba <strong>Dados</strong>: copie a URL do topo.</li>
      </ol>
      ${erro ? `<div class="alert-modal alert-error">${erro}</div>` : ''}
      <input type="text" id="baseUrlInput" placeholder="https://tatu-cup-default-rtdb.firebaseio.com" />
      <button class="btn btn-primary" style="width:100%; padding:14px;" onclick="app.conectar()">Conectar</button>
    </div>`;
}

/* ===================== APP ===================== */

function renderApp() {
  const userType = localStorage.getItem('userType') || 'viewer';
  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="header">
        <div>
          <h1>🎾 Tatu Cup 5 — Categoria C</h1>
          <div class="header-info">${userType === 'admin' ? '⚙️ Modo Admin' : '📖 Modo Visualização'}</div>
        </div>
        <div class="header-right">
          <span id="syncDot" class="sync-dot">● online</span>
          <button class="admin-toggle ${userType === 'admin' ? 'active' : ''}" onclick="app.openAdminModal()">⚙️</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-button active" onclick="app.switchTab('grupos', this)">📊 Grupos</button>
        <button class="tab-button" onclick="app.switchTab('jogos', this)">🎾 Jogos</button>
        <button class="tab-button" onclick="app.switchTab('partidas', this)">📋 Partidas</button>
        <button class="tab-button" onclick="app.switchTab('sorteio', this)">🎲 Quartas</button>
        <button class="tab-button" onclick="app.switchTab('quadro', this)">🏆 Chave</button>
        <button class="tab-button" onclick="app.switchTab('compartilhar', this)">🔗 Link</button>
      </div>

      <div id="grupos" class="tab-content active"></div>
      <div id="jogos" class="tab-content"></div>
      <div id="partidas" class="tab-content"></div>
      <div id="sorteio" class="tab-content"></div>
      <div id="quadro" class="tab-content"></div>
      <div id="compartilhar" class="tab-content"></div>
    </div>`;
  setSync(syncStatus);
  app.renderAtual();
}

const app = {
  abaAtual: 'grupos',

  /* ---------- setup ---------- */
  async conectar() {
    let base = document.getElementById('baseUrlInput').value.trim();
    if (!base) return;
    if (!/^https?:\/\//.test(base)) base = 'https://' + base;
    base = base.replace(/\/+$/, '');
    try {
      await testarConexao(base);
    } catch (e) {
      renderSetup('Não consegui acessar essa URL. Confira se copiou certo e se publicou as regras.');
      return;
    }
    localStorage.setItem('baseUrl', base);
    location.replace(location.pathname + '?db=' + encodeURIComponent(base));
  },

  /* ---------- admin ---------- */
  openAdminModal() {
    if ((localStorage.getItem('userType') || 'viewer') === 'admin') {
      if (confirm('Sair do modo admin?')) {
        localStorage.setItem('userType', 'viewer');
        renderApp();
      }
      return;
    }
    document.getElementById('adminModal').classList.add('active');
    document.getElementById('adminPassword').focus();
  },

  closeAdminModal() {
    document.getElementById('adminModal').classList.remove('active');
    document.getElementById('adminPassword').value = '';
    document.getElementById('alertContainer').innerHTML = '';
  },

  loginAdmin() {
    const senha = document.getElementById('adminPassword').value;
    if (!SENHAS_ADMIN.includes(senha)) {
      document.getElementById('alertContainer').innerHTML = '<div class="alert-modal alert-error">⚠️ Senha incorreta</div>';

    }
    localStorage.setItem('userType', 'admin');
    this.closeAdminModal();
    renderApp();
  },

  isAdmin() { return (localStorage.getItem('userType') || 'viewer') === 'admin'; },

  /* ---------- navegação ---------- */
  switchTab(tab, btn) {
    this.abaAtual = tab;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    if (btn) btn.classList.add('active');
    this.renderAtual();
  },

  renderAtual() {
    const t = this.abaAtual;
    if (t === 'grupos') this.renderGrupos();
    if (t === 'jogos') this.renderJogos();
    if (t === 'partidas') this.renderPartidas();
    if (t === 'sorteio') this.renderSorteio();
    if (t === 'quadro') this.renderQuadro();
    if (t === 'compartilhar') this.renderCompartilhar();
  },

  /* ---------- ranking ---------- */
  calcRanking(grupo) {
    const stats = {};
    GRUPOS[grupo].forEach(p => {
      stats[p.nome] = { ...p, grupo, wins: 0, points: 0, setsGanhos: 0, setsPerdidos: 0, jogos: 0 };
    });

    DADOS.matches.filter(m => m.grupo === grupo).forEach(m => {
      if (!stats[m.player1] || !stats[m.player2]) return;
      const s1 = m.scoreP1 || 0, s2 = m.scoreP2 || 0;
      stats[m.player1].setsGanhos += s1;
      stats[m.player1].setsPerdidos += s2;
      stats[m.player2].setsGanhos += s2;
      stats[m.player2].setsPerdidos += s1;
      stats[m.player1].jogos++;
      stats[m.player2].jogos++;
      if (s1 > s2) { stats[m.player1].wins++; stats[m.player1].points += 3; }
      else if (s2 > s1) { stats[m.player2].wins++; stats[m.player2].points += 3; }
    });

    return Object.values(stats).sort((a, b) =>
      b.points - a.points ||
      (b.setsGanhos - b.setsPerdidos) - (a.setsGanhos - a.setsPerdidos) ||
      b.setsGanhos - a.setsGanhos
    );
  },

  /* quantos jogos do grupo ainda faltam */
  faltamNoGrupo(grupo) {
    const total = gerarJogos(grupo).length;
    const feitos = DADOS.matches.filter(m => m.grupo === grupo).length;
    return total - feitos;
  },

  faltamTotal() {
    return LETRAS.reduce((acc, g) => acc + this.faltamNoGrupo(g), 0);
  },

  renderGrupos() {
    let html = '<div class="grupos-grid">';
    LETRAS.forEach(grupo => {
      const ranking = this.calcRanking(grupo);
      const faltam = this.faltamNoGrupo(grupo);
      html += `
        <div class="grupo-card">
          <div class="grupo-header">
            <span class="grupo-badge">GRUPO ${grupo}</span>
            <span style="font-size:11px;color:#999;margin-left:8px;">${faltam === 0 ? '✓ encerrado' : faltam + ' jogo(s) a fazer'}</span>
          </div>
          <table class="ranking-table">
            <thead><tr><th>Pos</th><th>Jogador</th><th>V</th><th>Pts</th><th>SG</th><th>SP</th><th>Saldo</th></tr></thead>
            <tbody>
              ${ranking.map((p, i) => {
                const saldo = p.setsGanhos - p.setsPerdidos;
                const cls = saldo > 0 ? 'stat-positivo' : saldo < 0 ? 'stat-negativo' : 'stat-neutro';
                return `<tr class="${i < 2 ? 'classificado' : ''}">
                  <td style="font-weight:600;color:#007AFF;">${i + 1}</td>
                  <td><p class="player-nome">${p.nome}</p><p class="player-clube">${p.clube || '-'}</p></td>
                  <td>${p.wins}</td>
                  <td style="font-weight:600;color:#4caf50;">${p.points}</td>
                  <td class="stat-positivo">${p.setsGanhos}</td>
                  <td class="stat-negativo">${p.setsPerdidos}</td>
                  <td class="${cls}">${saldo > 0 ? '+' : ''}${saldo}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    });
    html += '</div>';
    document.getElementById('grupos').innerHTML = html;
  },

  /* ---------- jogos ---------- */
  renderJogos() {
    const isAdmin = this.isAdmin();
    let html = '';

    LETRAS.forEach(grupo => {
      const jogos = gerarJogos(grupo);
      html += `<div class="jogo-grupo"><h3><span class="grupo-badge">GRUPO ${grupo}</span> &nbsp;${jogos.length} partidas</h3><div class="rodada-games">`;

      jogos.forEach(jogo => {
        const m = DADOS.matches.find(x => x.grupo === grupo && x.player1 === jogo.p1 && x.player2 === jogo.p2);
        const played = !!m;
        const k = chaveJogo(grupo, jogo.p1, jogo.p2);

        html += `
          <div class="jogo-placar ${played ? 'played' : ''}" data-k="${k}">
            ${played ? '<span class="jogo-status">✓ Disputado</span>' : ''}
            <div class="placar-container">
              <div class="placar-jogador">
                <div class="placar-jogador-nome">${jogo.p1}</div>
                <input type="number" inputmode="numeric" class="placar-input placar-p1" value="${played ? m.scoreP1 : ''}" placeholder="0" ${isAdmin ? '' : 'disabled'} min="0" />
              </div>
              <div class="placar-vs-texto">x</div>
              <div class="placar-jogador">
                <div class="placar-jogador-nome">${jogo.p2}</div>
                <input type="number" inputmode="numeric" class="placar-input placar-p2" value="${played ? m.scoreP2 : ''}" placeholder="0" ${isAdmin ? '' : 'disabled'} min="0" />
              </div>
            </div>
            ${isAdmin ? `<div class="jogo-acoes">
              <button class="btn btn-primary" style="flex:1;" onclick="app.salvarResultado('${grupo}','${jogo.p1}','${jogo.p2}')">${played ? 'Atualizar' : 'Registrar'}</button>
              ${played ? `<button class="btn btn-danger" onclick="app.deletarResultado('${grupo}','${jogo.p1}','${jogo.p2}')">Apagar</button>` : ''}
            </div>` : ''}
          </div>`;
      });

      html += '</div></div>';
    });

    document.getElementById('jogos').innerHTML = html;
  },

  async salvarResultado(grupo, p1, p2) {
    const card = document.querySelector(`[data-k="${chaveJogo(grupo, p1, p2)}"]`);
    const s1 = parseInt(card.querySelector('.placar-p1').value);
    const s2 = parseInt(card.querySelector('.placar-p2').value);
    if (isNaN(s1) || isNaN(s2)) { alert('Preencha os dois placares.'); return; }
    if (s1 === s2) { alert('O placar não pode empatar.'); return; }

    await carregarDados();
    const i = DADOS.matches.findIndex(m => m.grupo === grupo && m.player1 === p1 && m.player2 === p2);
    const novo = { grupo, player1: p1, player2: p2, scoreP1: s1, scoreP2: s2, winner: s1 > s2 ? 'player1' : 'player2' };
    if (i >= 0) DADOS.matches[i] = novo; else DADOS.matches.push(novo);
    await salvarDados();
    this.renderAtual();
  },

  async deletarResultado(grupo, p1, p2) {
    if (!confirm('Apagar este resultado?')) return;
    await carregarDados();
    DADOS.matches = DADOS.matches.filter(m => !(m.grupo === grupo && m.player1 === p1 && m.player2 === p2));
    await salvarDados();
    this.renderAtual();
  },

  renderPartidas() {

  /* =================================================================
     QUARTAS DE FINAL — definição dos classificados e sorteio
     1º de cada grupo = cabeça de chave (fica fixo na sua posição)
     2º de cada grupo = sorteado contra um dos cabeças
     ================================================================= */

  renderSorteio() {
    const isAdmin = this.isAdmin();
    const f2 = DADOS.fase2;
    const faltam = this.faltamTotal();
    let html = '';

    if (DADOS.fase2Legado) {
      html += `<div class="section-card"><div class="alert-modal alert-warn">
        ⚠️ Havia um chaveamento gravado no formato antigo (dois grupos de 4). Ele foi ignorado porque o formato mudou para quartas de final. Faça o sorteio novamente abaixo.
      </div></div>`;
    }

    if (f2) {
      html += `<div class="section-card">
        <h3>✓ Quartas de final sorteadas</h3>
        <div class="sorteio-cols">
          ${f2.quartas.map((c, i) => `
            <div class="sorteio-grupo">
              <h4>Quartas ${i + 1}</h4>
              <div style="font-size:13px;line-height:1.8;">
                <span class="badge-seed">${c.p1 ? c.p1.rot : '?'}</span> ${c.p1 ? c.p1.nome : '-'}<br>
                <span style="color:#999;font-size:12px;">versus</span><br>
                <span class="badge-dois">${c.p2 ? c.p2.rot : '?'}</span> ${c.p2 ? c.p2.nome : '-'}
              </div>
            </div>`).join('')}
        </div>
        <p style="font-size:13px;color:#666;margin-top:16px;">

        </p>
        ${isAdmin ? '<button class="btn btn-danger" style="margin-top:8px;" onclick="app.resetarFase2()">Refazer o sorteio das quartas</button>' : ''}
      </div>`;
      document.getElementById('sorteio').innerHTML = html;
      return;
    }

    if (!isAdmin) {
      html += '<div class="section-card"><p style="color:#999;text-align:center;padding:20px;">As quartas de final aparecem aqui quando a fase de grupos terminar.</p></div>';
      document.getElementById('sorteio').innerHTML = html;
      return;
    }

    html += `<div class="section-card">
      <h3>🎲 Sorteio das quartas de final</h3>
      ${faltam > 0 ? `<div class="alert-modal alert-warn">⚠️ Ainda faltam <strong>${faltam} jogo(s)</strong> na fase de grupos. Dá para sortear mesmo assim, mas a classificação ainda pode mudar.</div>` : ''}
      <p style="color:#666;font-size:13px;line-height:1.5;">
        O <strong>1º de cada grupo é cabeça de chave</strong> e ocupa uma posição fixa. Os <strong>2º colocados são sorteados</strong> entre os quatro cabeças.
        Os campos já vêm preenchidos pela classificação atual — ajuste à mão se houver empate técnico ou desistência.
      </p>
      <div class="sorteio-cols">`;

    LETRAS.forEach(grupo => {
      const ranking = this.calcRanking(grupo);
      const opcoes = (sel) => GRUPOS[grupo].map(p =>
        `<option value="${p.nome}" ${p.nome === sel ? 'selected' : ''}>${p.nome}</option>`).join('');
      html += `
        <div class="sorteio-grupo">
          <h4><span class="grupo-badge">GRUPO ${grupo}</span></h4>
          <span class="sorteio-label">1º — cabeça de chave</span>
          <select class="sorteio-select seed" id="sel-1-${grupo}">${opcoes(ranking[0] && ranking[0].nome)}</select>
          <span class="sorteio-label">2º colocado</span>
          <select class="sorteio-select" id="sel-2-${grupo}">${opcoes(ranking[1] && ranking[1].nome)}</select>
          <p class="ranking-mini">${ranking.map((p, i) => `${i + 1}º ${p.nome} — ${p.points} pts, saldo ${p.setsGanhos - p.setsPerdidos}`).join('<br>')}</p>
        </div>`;
    });

    html += `</div>
      <label class="check-linha">
        <input type="checkbox" id="evitarMesmoGrupo" checked />
        <span>Evitar que o 2º colocado caia contra o 1º do próprio grupo (evita reencontro da fase de grupos).</span>
      </label>
      <button class="btn btn-primary" style="margin-top:16px;width:100%;padding:14px;" onclick="app.sortearQuartas()">🎲 Sortear as quartas de final</button>
      <p style="font-size:12px;color:#999;margin-top:10px;">
        Formato: quartas até ${PONTOS_QUARTAS} pontos • semis e final em melhor de ${SETS_SERIE} sets de ${GAMES_SET} games.
      </p>
    </div>`;

    document.getElementById('sorteio').innerHTML = html;

  lerEscolhas() {
    const cabecas = [], segundos = [];
    for (const grupo of LETRAS) {
      const n1 = document.getElementById('sel-1-' + grupo).value;
      const n2 = document.getElementById('sel-2-' + grupo).value;
      if (n1 === n2) { alert('No Grupo ' + grupo + ' o 1º e o 2º colocado são a mesma pessoa. Corrija antes de sortear.'); return null; }
      const p1 = GRUPOS[grupo].find(p => p.nome === n1);
      const p2 = GRUPOS[grupo].find(p => p.nome === n2);
      cabecas.push({ nome: n1, clube: p1 ? p1.clube : '', grupo, pos: 1, rot: '1º ' + grupo });
      segundos.push({ nome: n2, clube: p2 ? p2.clube : '', grupo, pos: 2, rot: '2º ' + grupo });
    }
    return { cabecas, segundos };
  },

  async sortearQuartas() {
    const esc = this.lerEscolhas();
    if (!esc) return;
    const evitar = document.getElementById('evitarMesmoGrupo').checked;

    if (!confirm('Sortear as quartas de final? Isso define os quatro confrontos.')) return;

    const embaralhar = (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    let sorteados = embaralhar(esc.segundos);
    if (evitar) {
      let ok = false;
      for (let t = 0; t < 500 && !ok; t++) {
        sorteados = embaralhar(esc.segundos);
        ok = sorteados.every((s, i) => s.grupo !== esc.cabecas[i].grupo);
      }
      if (!ok) {
        // combinação válida sempre existe com 4 grupos distintos, mas se algo
        // fugir do esperado, corrige por troca em vez de travar o sorteio.
        for (let i = 0; i < sorteados.length; i++) {
          if (sorteados[i].grupo === esc.cabecas[i].grupo) {
            const j = (i + 1) % sorteados.length;
            [sorteados[i], sorteados[j]] = [sorteados[j], sorteados[i]];
          }
        }
      }
    }

    const fase2 = {
      versao: FORMATO_FASE2,
      quartas: esc.cabecas.map((c, i) => ({ p1: c, p2: sorteados[i], s1: null, s2: null })),
      semis: [{ sets: [] }, { sets: [] }],
      final: { sets: [] }
    };

    await carregarDados();
    DADOS.fase2 = fase2;
    await salvarDados();
    this.abaAtual = 'quadro';
    renderApp();
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(b => b.classList.remove('active'));
    document.getElementById('quadro').classList.add('active');
    const btns = document.querySelectorAll('.tab-button');
    if (btns[4]) btns[4].classList.add('active');
    this.renderQuadro();
  },

  async resetarFase2() {
    if (!confirm('Refazer o sorteio? Todos os resultados das quartas, semifinais e final serão apagados.')) return;
    await carregarDados();
    DADOS.fase2 = null;
    await salvarDados();
    this.renderAtual();
  },

     CHAVE
     ================================================================= */

  semifinalistas() {
    const q = DADOS.fase2.quartas;
    return [
      { p1: vencedorPontos(q[0]), p2: vencedorPontos(q[1]) },
      { p1: vencedorPontos(q[2]), p2: vencedorPontos(q[3]) }
    ];

  boxSets(key, p1, p2, sets, rotulo) {

  },

        <h3>🏆 Chave da fase final</h3>
        ${aviso}
        <p style="color:#666;font-size:14px;line-height:1.6;">A chave aparece aqui assim que o sorteio for feito na aba <strong>🎲 Quartas</strong>.</p>
        <div class="chave" style="margin-top:16px;opacity:0.55;">
          <div class="chave-col">
            <div class="chave-titulo">Quartas de final</div>
            ${[1, 2, 3, 4].map(i => this.boxVazio('Quartas ' + i)).join('')}
          </div>
          <div class="chave-col">
            <div class="chave-titulo">Semifinais</div>
            ${this.boxVazio('Semifinal 1')}
            ${this.boxVazio('Semifinal 2')}
          </div>
          <div class="chave-col">
            <div class="chave-titulo">Final</div>
            ${this.boxVazio('Final')}
          </div>
        </div>
      </div>`;
      return;
    }

    const sf = this.semifinalistas();
    const fin = this.finalistas();
    const camp = this.campeao();

    el.innerHTML = `
      ${aviso}
      <div class="chave">
        <div class="chave-col">
          <div class="chave-titulo">Quartas de final</div>
          ${f2.quartas.map((c, i) => this.boxPontos('q' + i, c, 'Quartas ' + (i + 1))).join('')}
        </div>

        <div class="chave-col">
          <div class="chave-titulo">Semifinais</div>
          ${this.boxSets('sf0', sf[0].p1, sf[0].p2, f2.semis[0].sets, 'Semifinal 1 — vencedores das Quartas 1 e 2')}
          ${this.boxSets('sf1', sf[1].p1, sf[1].p2, f2.semis[1].sets, 'Semifinal 2 — vencedores das Quartas 3 e 4')}
        </div>

        <div class="chave-col">
          <div class="chave-titulo">Final</div>
          ${this.boxSets('fin', fin[0], fin[1], f2.final.sets, 'Final')}
          ${camp ? `<div class="campeao">🏆 ${camp.nome}<div style="font-size:12px;font-weight:400;color:#a1887f;margin-top:4px;">${camp.clube || ''}</div></div>` : ''}
        </div>
      </div>`;
  },

  /* ---------- gravação das quartas ---------- */
  async salvarQuarta(key) {
    const card = document.querySelector(`[data-c="${key}"]`);
    const s1 = parseInt(card.querySelector('.c-s1').value);
    const s2 = parseInt(card.querySelector('.c-s2').value);
    if (isNaN(s1) || isNaN(s2)) { alert('Preencha os dois placares.'); return; }
    if (s1 === s2) { alert('O placar não pode empatar.'); return; }
    if (s1 < 0 || s2 < 0) { alert('Os pontos não podem ser negativos.'); return; }
    const max = Math.max(s1, s2);
    if (max < PONTOS_QUARTAS) {
      alert('A partida só termina quando alguém chega a ' + PONTOS_QUARTAS + ' pontos.');
      return;
    }

    const i = parseInt(key.slice(1));

    await carregarDados();
    const f2 = DADOS.fase2;
    if (!f2) { alert('O sorteio das quartas ainda não foi feito.'); return; }

    const antes = vencedorPontos(f2.quartas[i]);
    f2.quartas[i].s1 = s1;
    f2.quartas[i].s2 = s2;
    const depois = vencedorPontos(f2.quartas[i]);

    // integridade: se o vencedor mudou, zera a semi dependente e a final
    if (antes && depois && !mesmoJogador(antes, depois)) {
      const semi = i < 2 ? 0 : 1;
      f2.semis[semi].sets = [];
      f2.final.sets = [];
    }

    await salvarDados();
    this.renderAtual();
  },

  /* ---------- gravação de semis e final (sets) ---------- */
  async salvarSerie(key) {
    const card = document.querySelector(`[data-c="${key}"]`);
    const sets = [];

    for (let i = 0; i < SETS_SERIE; i++) {
      const v1 = card.querySelector('.set-g1-' + i).value.trim();
      const v2 = card.querySelector('.set-g2-' + i).value.trim();
      if (v1 === '' && v2 === '') { sets.push(null); continue; }
      const g1 = parseInt(v1), g2 = parseInt(v2);
      if (isNaN(g1) || isNaN(g2)) { alert('Set ' + (i + 1) + ': preencha os games dos dois jogadores.'); return; }
      const erro = validarSet(g1, g2);
      if (erro) { alert('Set ' + (i + 1) + ': ' + erro + '.'); return; }
      sets.push({ g1, g2 });
    }

    if (!sets[0]) { alert('Preencha pelo menos o Set 1.'); return; }
    if (!sets[1] && sets[2]) { alert('Preencha o Set 2 antes do Set 3.'); return; }

    // não pode existir 3º set se alguém já fechou em 2 a 0
    if (sets[2]) {
      const parcial = contarSets([sets[0], sets[1]]);
      if (parcial.a === 2 || parcial.b === 2) {
        alert('A partida já terminou em 2 sets a 0. Apague o Set 3.');
        return;
      }
    }

    // remove os sets vazios do fim para gravar limpo no Firebase
    const limpos = sets.slice();
    while (limpos.length && !limpos[limpos.length - 1]) limpos.pop();
    if (limpos.some(s => !s)) { alert('Não deixe um set em branco no meio da partida.'); return; }

    await carregarDados();
    const f2 = DADOS.fase2;
    if (!f2) { alert('O sorteio das quartas ainda não foi feito.'); return; }

    const sf = this.semifinalistas();

    if (key === 'sf0' || key === 'sf1') {
      const idx = key === 'sf0' ? 0 : 1;
      const antes = vencedorSerie({ p1: sf[idx].p1, p2: sf[idx].p2, sets: f2.semis[idx].sets });
      f2.semis[idx].sets = limpos;
      const depois = vencedorSerie({ p1: sf[idx].p1, p2: sf[idx].p2, sets: limpos });
      if (antes && depois && !mesmoJogador(antes, depois)) f2.final.sets = [];
    } else if (key === 'fin') {
      f2.final.sets = limpos;
    }

    await salvarDados();
    this.renderAtual();
  },

  /* ---------- compartilhar ---------- */
  renderCompartilhar() {
    document.getElementById('compartilhar').innerHTML = `
      <div class="section-card">
        <h3>🔗 Link do campeonato</h3>
        <p style="color:#555;font-size:14px;line-height:1.5;">Compartilhe exatamente este link. Ele já vem com o endereço do banco.</p>
        <div class="link-box">${location.href}</div>
        <button class="btn btn-primary" style="margin-top:12px;" onclick="app.copiarLink()">Copiar link</button>
      </div>`;
  },

  copiarLink() {
    navigator.clipboard.writeText(location.href)
      .then(() => alert('Link copiado!'))
      .catch(() => alert('Copie manualmente: ' + location.href));
  }
};

window.app = app;

/* ===================== INICIALIZAÇÃO ===================== */

(async function init() {
  const p = new URLSearchParams(location.search);
  BASE_URL = p.get('db') || localStorage.getItem('baseUrl');

  if (!BASE_URL) { renderSetup(); return; }

  if (!p.get('db')) history.replaceState(null, '', location.pathname + '?db=' + encodeURIComponent(BASE_URL));
  localStorage.setItem('baseUrl', BASE_URL);
  if (!localStorage.getItem('userType')) localStorage.setItem('userType', 'viewer');

  await carregarDados();
  renderApp();

  setInterval(async () => {
    const el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) return;
    if (document.getElementById('adminModal').classList.contains('active')) return;
    const antes = JSON.stringify(DADOS);
    await carregarDados();
    if (JSON.stringify(DADOS) !== antes) app.renderAtual();
  }, 8000);

  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    await carregarDados();
    app.renderAtual();
  });
})();
</script>
