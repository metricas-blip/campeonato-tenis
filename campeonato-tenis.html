<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎾 Campeonato de Tênis</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f5f5f5; }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; color: #999; }
    .modal h2 { margin: 0 0 8px 0; font-size: 24px; text-align: center; }
    .modal .subtitle { text-align: center; color: #666; margin: 0 0 24px 0; font-size: 13px; }
    .modal input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
    .modal-buttons { display: flex; gap: 12px; }
    .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; }
    .btn-admin-modal { background: #007AFF; color: white; }
    .btn-admin-modal:active { transform: scale(0.98); }
    .btn-cancel { background: #f0f0f0; border: 1px solid #ddd; }
    .alert-modal { margin-bottom: 16px; padding: 12px; border-radius: 6px; font-size: 13px; }
    .alert-error { background: #ffebee; color: #c62828; }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #ddd; padding-bottom: 16px; }
    .header h1 { margin: 0; font-size: 24px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-info { font-size: 13px; color: #666; }
    .admin-toggle { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-size: 16px; transition: all 0.2s; color: #999; }
    .admin-toggle:hover { border-color: #007AFF; color: #007AFF; }
    .admin-toggle.active { background: #e3f2fd; border-color: #007AFF; color: #007AFF; }
    
    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
    .tab-button { padding: 12px 16px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 500; color: #999; transition: all 0.2s; font-size: 14px; }
    .tab-button.active { color: #333; border-bottom-color: #007AFF; }
    
    /* Tab Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Cards */
    .section-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section-card h2 { margin: 0 0 16px 0; font-size: 18px; }
    .section-card h3 { margin: 0 0 16px 0; font-size: 16px; }
    
    /* Grupos */
    .grupos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .grupo-card { background: #fafafa; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    .grupo-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .grupo-badge { background: #007AFF; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    
    .ranking-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ranking-table th { text-align: center; padding: 10px 6px; border-bottom: 1px solid #ddd; color: #999; font-weight: 600; font-size: 11px; background: white; text-transform: uppercase; }
    .ranking-table th:first-child { text-align: center; }
    .ranking-table th:nth-child(2) { text-align: left; }
    .ranking-table td { padding: 10px 6px; border-bottom: 1px solid #eee; font-size: 12px; text-align: center; }
    .ranking-table td:nth-child(2) { text-align: left; }
    .ranking-table tr:hover { background: #f5f5f5; }
    
    .player-nome { font-weight: 500; font-size: 13px; margin: 0; }
    .player-clube { font-size: 10px; color: #999; margin: 2px 0 0 0; }
    
    .stat-positivo { color: #4caf50; font-weight: 600; }
    .stat-negativo { color: #f44336; }
    .stat-neutro { color: #333; }
    
    /* Jogos */
    .jogos-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    .jogo-grupo { background: #fafafa; border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    .jogo-grupo h3 { margin: 0 0 16px 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .rodada-title { font-size: 12px; font-weight: 600; color: #999; margin: 16px 0 12px 0; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #ddd; }
    .rodada-games { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    
    /* Jogo Item - PLACAR */
    .jogo-placar { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 14px; }
    .jogo-placar.played { background: #e8f5e9; }
    
    .jogo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .jogo-status { font-size: 11px; font-weight: 600; color: #4caf50; }
    
    .placar-container { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .placar-jogador { flex: 1; }
    .placar-jogador-nome { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .placar-input { width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; font-weight: 600; text-align: center; }
    .placar-input:focus { border-color: #007AFF; outline: none; background: #f5f5f5; }
    .placar-input:disabled { background: #fafafa; cursor: not-allowed; }
    
    .placar-vs { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 35px; }
    .placar-vs-texto { font-size: 11px; color: #999; font-weight: 500; }
    
    .jogo-acoes { display: flex; gap: 8px; margin-top: 12px; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 12px; }
    .btn-primary { background: #007AFF; color: white; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary { background: #f0f0f0; border: 1px solid #ddd; }
    .btn-secondary:active { transform: scale(0.98); }
    .btn-danger { background: #ffebee; color: #f44336; border: 1px solid #ddd; }
    
    /* Alert */
    .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    
    /* Sorteio */
    .sorteio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .sorteio-item { background: #fafafa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s; }
    .sorteio-item:hover { border-color: #007AFF; background: #f0f0f0; }
    .sorteio-item.selected { border: 2px solid #007AFF; background: #e3f2fd; color: #007AFF; }
    .sorteio-item-name { font-weight: 500; font-size: 13px; }
    .sorteio-item-pts { font-size: 11px; color: #999; margin-top: 4px; }
    
    /* Bracket */
    .bracket-container { display: flex; gap: 20px; overflow-x: auto; padding: 20px 0; }
    .bracket-column { min-width: 250px; background: #fafafa; border-radius: 8px; padding: 16px; }
    .bracket-title { font-weight: 600; font-size: 12px; color: #999; margin-bottom: 12px; text-transform: uppercase; }
    .match-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; min-height: 90px; display: flex; flex-direction: column; justify-content: center; }
    .match-player { padding: 6px 0; font-size: 13px; }
    .match-player.winner { font-weight: 600; color: #4caf50; }
    .vs-label { text-align: center; color: #999; font-size: 11px; margin: 4px 0; }
    .match-buttons { display: flex; gap: 4px; margin-top: 8px; }
    .match-buttons button { flex: 1; padding: 4px 8px; font-size: 11px; }
  </style>
</head>
<body>

<div id="app"></div>

<!-- Modal de Login Admin -->
<div id="adminModal" class="modal">
  <div class="modal-content" style="position: relative;">
    <button class="modal-close" onclick="window.app.closeAdminModal()">✕</button>
    <h2>⚙️ Admin</h2>
    <p class="subtitle">Digite a senha para acessar modo admin</p>
    <div id="alertContainer"></div>
    <input type="password" id="adminPassword" placeholder="Senha" />
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="window.app.closeAdminModal()">Cancelar</button>
      <button class="btn-admin-modal" onclick="window.app.loginAdmin()">Entrar</button>
    </div>
  </div>
</div>

<script>
const GRUPOS = {
  'A': [
    { nome: 'Joao', clube: 'Resort Tambore' },
    { nome: 'Eduardo Mineiro', clube: 'Resort Tambore' },
    { nome: 'Eduardo', clube: 'Valville 1' },
    { nome: 'Marcelinho', clube: 'Resort Tambore' }
  ],
  'B': [
    { nome: 'Lucas Medina', clube: 'Soho' },
    { nome: 'Vinicius', clube: 'Tambore 10' },
    { nome: 'Fernando', clube: 'Eredita' },
    { nome: 'Anderson', clube: 'Boulevard' }
  ],
  'C': [
    { nome: 'Gabriel Santos', clube: 'Soho' },
    { nome: 'Fernando', clube: 'Exclusive House' },
    { nome: 'Gabriel Kenzo', clube: 'Soho' },
    { nome: 'Duarte', clube: 'Boulevard' }
  ],
  'D': [
    { nome: 'Victor', clube: 'Alpha Sitio' },
    { nome: 'Lucas Roris', clube: 'Resort Tambore' },
    { nome: 'Daniel', clube: 'Resort Tambore' }
  ]
};

function gerarJogos(grupo) {
  const players = GRUPOS[grupo];
  const jogos = [];
  
  // Gera todos os confrontos possíveis (round-robin)
  for (let i = 0; i < players.length; i++) {
    for (let j = i + 1; j < players.length; j++) {
      jogos.push({ p1: players[i].nome, p2: players[j].nome });
    }
  }
  
  return [jogos]; // Retorna como um array com um elemento (sem divisão de rodadas)
}

function renderApp() {
  const userType = localStorage.getItem('userType') || 'viewer';
  const app = document.getElementById('app');
  
  app.innerHTML = `
    <div class="container">
      <div class="header">
        <div>
          <h1>🎾 Campeonato de Tênis</h1>
          <div class="header-info">${userType === 'admin' ? '⚙️ Modo Admin ativado' : '📖 Modo Visualização'}</div>
        </div>
        <div class="header-right">
          <button class="admin-toggle ${userType === 'admin' ? 'active' : ''}" title="Alternar modo admin" onclick="window.app.openAdminModal()">⚙️</button>
        </div>
      </div>
      
      <div class="tabs">
        <button class="tab-button active" onclick="window.app.switchTab('grupos')">📊 Grupos</button>
        <button class="tab-button" onclick="window.app.switchTab('jogos')">🎾 Jogos</button>
        <button class="tab-button" onclick="window.app.switchTab('partidas')">📋 Partidas</button>
        <button class="tab-button" onclick="window.app.switchTab('sorteio')">🎲 Sorteio</button>
        <button class="tab-button" onclick="window.app.switchTab('quadro')">🏆 Quadro</button>
      </div>
      
      <div id="grupos" class="tab-content active"></div>
      <div id="jogos" class="tab-content"></div>
      <div id="partidas" class="tab-content"></div>
      <div id="sorteio" class="tab-content"></div>
      <div id="quadro" class="tab-content"></div>
    </div>
  `;
  
  window.app.renderGrupos();
}

window.app = {
  openAdminModal() {
    document.getElementById('adminModal').classList.add('active');
    document.getElementById('adminPassword').focus();
  },
  
  closeAdminModal() {
    document.getElementById('adminModal').classList.remove('active');
    document.getElementById('adminPassword').value = '';
    document.getElementById('alertContainer').innerHTML = '';
  },
  
  loginAdmin() {
    const password = document.getElementById('adminPassword').value;
    const alert = document.getElementById('alertContainer');
    const senhasValidas = ['lucaseleticia123', 'tatu123cup'];
    
    if (!senhasValidas.includes(password)) {
      alert.innerHTML = '<div class="alert-modal alert-error">⚠️ Senha incorreta</div>';
      return;
    }
    
    localStorage.setItem('userType', 'admin');
    alert.innerHTML = '<div class="alert-modal alert-success">✓ Modo admin ativado!</div>';
    setTimeout(() => {
      this.closeAdminModal();
      renderApp();
    }, 500);
  },
  
  switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
    
    if (tab === 'jogos') this.renderJogos();
    if (tab === 'partidas') this.renderPartidas();
    if (tab === 'sorteio') this.renderSorteio();
    if (tab === 'quadro') this.renderQuadro();
  },
  
  calcRanking(grupo) {
    const players = GRUPOS[grupo];
    const matches = JSON.parse(localStorage.getItem('matches') || '[]');
    const stats = {};
    
    players.forEach(p => {
      stats[p.nome] = { ...p, wins: 0, points: 0, setsGanhos: 0, setsPerdidos: 0 };
    });
    
    matches.filter(m => m.grupo === grupo).forEach(m => {
      if (stats[m.player1] && stats[m.player2]) {
        const s1 = m.scoreP1 || 0;
        const s2 = m.scoreP2 || 0;
        
        stats[m.player1].setsGanhos += s1;
        stats[m.player1].setsPerdidos += s2;
        stats[m.player2].setsGanhos += s2;
        stats[m.player2].setsPerdidos += s1;
        
        if (s1 > s2) {
          stats[m.player1].wins++;
          stats[m.player1].points += 3;
        } else if (s2 > s1) {
          stats[m.player2].wins++;
          stats[m.player2].points += 3;
        }
      }
    });
    
    return Object.values(stats).sort((a, b) => b.points - a.points || b.setsGanhos - b.setsPerdidos - (a.setsGanhos - a.setsPerdidos));
  },
  
  renderGrupos() {
    const container = document.getElementById('grupos');
    let html = '<div class="grupos-grid>';
    
    Object.keys(GRUPOS).forEach(grupo => {
      const ranking = this.calcRanking(grupo);
      html += `
        <div class="grupo-card">
          <div class="grupo-header">
            <span class="grupo-badge">GRUPO ${grupo}</span>
          </div>
          <table class="ranking-table">
            <thead><tr>
              <th>Pos</th>
              <th>Jogador</th>
              <th>V</th>
              <th>Pts</th>
              <th>SG</th>
              <th>SP</th>
              <th>Saldo</th>
            </tr></thead>
            <tbody>
              ${ranking.map((p, i) => {
                const saldo = p.setsGanhos - p.setsPerdidos;
                const saldoClass = saldo > 0 ? 'stat-positivo' : saldo < 0 ? 'stat-negativo' : 'stat-neutro';
                return `
                  <tr>
                    <td style="font-weight: 600; color: #007AFF;">${i + 1}</td>
                    <td>
                      <p class="player-nome">${p.nome}</p>
                      <p class="player-clube">${p.clube || '-'}</p>
                    </td>
                    <td>${p.wins}</td>
                    <td style="font-weight: 600; color: #4caf50;">${p.points}</td>
                    <td class="stat-positivo">${p.setsGanhos}</td>
                    <td class="stat-negativo">${p.setsPerdidos}</td>
                    <td class="${saldoClass}">${saldo > 0 ? '+' : ''}${saldo}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    });
    
    html += '</div>';
    container.innerHTML = html;
  },
  
  renderJogos() {
    const container = document.getElementById('jogos');
    const userType = localStorage.getItem('userType') || 'viewer';
    const matches = JSON.parse(localStorage.getItem('matches') || '[]');
    let html = '<div class="jogos-grid>';
    
    Object.keys(GRUPOS).forEach(grupo => {
      const todosJogos = gerarJogos(grupo)[0];
      
      html += `<div class="jogo-grupo">
        <h3><span class="grupo-badge">GRUPO ${grupo}</span> (${todosJogos.length} partidas)</h3>`;
      html += `<div class="rodada-games">`;
      
      todosJogos.forEach((jogo) => {
        const match = matches.find(m => m.grupo === grupo && m.player1 === jogo.p1 && m.player2 === jogo.p2);
        const isPlayed = match !== undefined;
        
        html += `
          <div class="jogo-placar ${isPlayed ? 'played' : ''}" data-grupo="${grupo}" data-p1="${jogo.p1}" data-p2="${jogo.p2}">
            ${isPlayed ? `<div class="jogo-header"><span class="jogo-status">✓ Disputado</span></div>` : ''}
            
            <div class="placar-container">
              <div class="placar-jogador">
                <div class="placar-jogador-nome">${jogo.p1}</div>
                <input type="number" class="placar-input placar-p1" value="${match?.scoreP1 || '0'}" ${userType !== 'admin' ? 'disabled' : ''} min="0" />
              </div>
              
              <div class="placar-vs">
                <div class="placar-vs-texto">x</div>
              </div>
              
              <div class="placar-jogador">
                <div class="placar-jogador-nome">${jogo.p2}</div>
                <input type="number" class="placar-input placar-p2" value="${match?.scoreP2 || '0'}" ${userType !== 'admin' ? 'disabled' : ''} min="0" />
              </div>
            </div>
            
            ${userType === 'admin' && !isPlayed ? `
              <div class="jogo-acoes">
                <button class="btn btn-primary" onclick="window.app.salvarResultado('${grupo}', '${jogo.p1}', '${jogo.p2}')" style="flex: 1;">Registrar</button>
              </div>
            ` : ''}
            
            ${isPlayed && userType === 'admin' ? `
              <div class="jogo-acoes">
                <button class="btn btn-danger" onclick="window.app.deletarResultado('${grupo}', '${jogo.p1}', '${jogo.p2}')" style="flex: 1;">Deletar</button>
              </div>
            ` : ''}
          </div>
        `;
      });
      
      html += `</div></div>`;
    });
    
    html += '</div>';
    container.innerHTML = html;
  },
  
  salvarResultado(grupo, p1, p2) {
    const card = document.querySelector(`[data-grupo="${grupo}"][data-p1="${p1}"][data-p2="${p2}"]`);
    const score1 = parseInt(card.querySelector('.placar-p1').value) || 0;
    const score2 = parseInt(card.querySelector('.placar-p2').value) || 0;
    
    const matches = JSON.parse(localStorage.getItem('matches') || '[]');
    matches.push({
      grupo,
      player1: p1,
      player2: p2,
      scoreP1: score1,
      scoreP2: score2,
      winner: score1 > score2 ? 'player1' : 'player2'
    });
    localStorage.setItem('matches', JSON.stringify(matches));
    
    this.renderGrupos();
    this.renderJogos();
  },
  
  deletarResultado(grupo, p1, p2) {
    const matches = JSON.parse(localStorage.getItem('matches') || '[]');
    const idx = matches.findIndex(m => m.grupo === grupo && m.player1 === p1 && m.player2 === p2);
    if (idx >= 0) {
      matches.splice(idx, 1);
      localStorage.setItem('matches', JSON.stringify(matches));
      this.renderGrupos();
      this.renderJogos();
    }
  },
  
  renderPartidas() {
    const userType = localStorage.getItem('userType') || 'viewer';
    const container = document.getElementById('partidas');
    const matches = JSON.parse(localStorage.getItem('matches') || '[]');
    let html = '';
    
    html += `
      <div class="section-card">
        <h3>📋 Histórico (${matches.length} partidas)</h3>
        <div style="max-height: 500px; overflow-y: auto;">
          ${matches.length === 0 ? '<p style="color: #999; text-align: center; padding: 20px;">Nenhuma partida registrada</p>' : matches.map((m, i) => `
            <div style="padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="background: #e3f2fd; color: #007AFF; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;">Grupo ${m.grupo}</span>
                <div style="margin-top: 6px; font-size: 13px;">
                  <div style="color: ${m.winner === 'player1' ? '#4caf50' : '#333'}; font-weight: ${m.winner === 'player1' ? '600' : '400'};"><strong>${m.player1}</strong> ${m.scoreP1} x ${m.scoreP2} ${m.player2}</div>
                </div>
              </div>
              ${userType === 'admin' ? `<button class="btn btn-danger" onclick="window.app.deleteMatch(${i})">Deletar</button>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
    
    container.innerHTML = html;
  },
  
  deleteMatch(index) {
    const matches = JSON.parse(localStorage.getItem('matches') || '[]');
    matches.splice(index, 1);
    localStorage.setItem('matches', JSON.stringify(matches));
    this.renderGrupos();
    this.renderPartidas();
  },
  
  renderSorteio() {
    const container = document.getElementById('sorteio');
    const userType = localStorage.getItem('userType') || 'viewer';
    const quartas = JSON.parse(localStorage.getItem('quartas') || 'null');
    let html = '';
    
    if (!quartas && userType === 'admin') {
      html += '<div class="section-card"><h3>🎲 Sorteio das Quartas</h3><p style="color: #666; font-size: 13px; margin: 0 0 16px 0;">Selecione os 8 classificados (1º e 2º de cada grupo)</p><div class="sorteio-grid" id="sorteioGrid">';
      
      Object.keys(GRUPOS).forEach(grupo => {
        const ranking = this.calcRanking(grupo);
        html += `<div><div style="font-weight: 500; font-size: 12px; margin-bottom: 8px; color: #999;">Grupo ${grupo}</div>`;
        
        ranking.slice(0, 2).forEach((p, i) => {
          html += `
            <div class="sorteio-item" onclick="window.app.selectQuartas('${grupo}-${i}', '${p.nome}')">
              <div class="sorteio-item-name">${p.nome}</div>
              <div class="sorteio-item-pts">${p.points} pts</div>
            </div>
          `;
        });
        
        html += '</div>';
      });
      
      html += '</div><div class="form-buttons"><button class="btn btn-primary" onclick="window.app.confirmarSorteio()" style="margin-top: 16px;">Confirmar Sorteio</button></div></div>';
    } else if (quartas) {
      html += `
        <div class="section-card" style="background: #e8f5e9; border-color: #4caf50;">
          <h3 style="color: #2e7d32; margin: 0 0 16px 0;">✓ Quartas Confirmadas</h3>
          <div class="sorteio-grid">
            ${quartas.map((q, i) => `
              <div style="background: white; color: #333; padding: 12px; border-radius: 8px; border: 1px solid #ddd;">
                <div style="font-size: 11px; color: #999; margin-bottom: 8px; font-weight: 500;">QUARTA ${i + 1}</div>
                <div style="font-weight: 500; font-size: 13px; margin-bottom: 4px;">${q.p1}</div>
                <div style="font-size: 11px; color: #999; text-align: center;">vs</div>
                <div style="font-weight: 500; font-size: 13px;">${q.p2}</div>
              </div>
            `).join('')}
          </div>
          ${userType === 'admin' ? `<button class="btn btn-secondary" onclick="window.app.resetarSorteio()" style="margin-top: 16px;">Refazer Sorteio</button>` : ''}
        </div>
      `;
    } else if (userType !== 'admin') {
      html += '<div class="section-card"><p style="color: #999; text-align: center; padding: 20px;">Aguardando confirmação do sorteio das quartas...</p></div>';
    } else {
      html += '<div class="section-card"><p style="color: #999; text-align: center; padding: 20px;">Registre todas as partidas antes de fazer o sorteio</p></div>';
    }
    
    container.innerHTML = html;
  },
  
  selectedQuartas: [],
  
  selectQuartas(id, nome) {
    const idx = this.selectedQuartas.findIndex(q => q.id === id);
    if (idx >= 0) {
      this.selectedQuartas.splice(idx, 1);
    } else {
      if (this.selectedQuartas.length < 8) {
        this.selectedQuartas.push({ id, nome });
      } else {
        alert('Selecione apenas 8 jogadores');
        return;
      }
    }
    this.renderSorteio();
  },
  
  confirmarSorteio() {
    if (this.selectedQuartas.length !== 8) {
      alert('Selecione exatamente 8 jogadores');
      return;
    }
    
    const quartas = [];
    for (let i = 0; i < 8; i += 2) {
      quartas.push({ p1: this.selectedQuartas[i].nome, p2: this.selectedQuartas[i + 1].nome });
    }
    
    localStorage.setItem('quartas', JSON.stringify(quartas));
    this.selectedQuartas = [];
    this.renderSorteio();
  },
  
  resetarSorteio() {
    if (confirm('Deseja refazer o sorteio?')) {
      localStorage.removeItem('quartas');
      localStorage.removeItem('semis');
      localStorage.removeItem('finais');
      this.selectedQuartas = [];
      this.renderSorteio();
    }
  },
  
  renderQuadro() {
    const container = document.getElementById('quadro');
    const userType = localStorage.getItem('userType') || 'viewer';
    const quartas = JSON.parse(localStorage.getItem('quartas') || 'null');
    const semis = JSON.parse(localStorage.getItem('semis') || '[]');
    const finais = JSON.parse(localStorage.getItem('finais') || 'null');
    
    if (!quartas) {
      container.innerHTML = '<div class="section-card"><p style="color: #999; text-align: center; padding: 20px;">Aguardando sorteio das quartas...</p></div>';
      return;
    }
    
    let html = '<div class="bracket-container">';
    html += '<div class="bracket-column"><div class="bracket-title">Quartas</div>';
    
    quartas.forEach((q, i) => {
      html += `<div class="match-box">
        <div class="match-player">${q.p1}</div>
        <div class="vs-label">vs</div>
        <div class="match-player">${q.p2}</div>`;
      
      if (userType === 'admin') {
        html += `<div class="match-buttons">
          <button class="btn btn-secondary" onclick="window.app.regVencedor('quarta', ${i}, '${q.p1}')">P1</button>
          <button class="btn btn-secondary" onclick="window.app.regVencedor('quarta', ${i}, '${q.p2}')">P2</button>
        </div>`;
      }
      
      html += '</div>';
    });
    
    html += '</div>';
    
    if (semis.length > 0) {
      html += '<div class="bracket-column"><div class="bracket-title">Semifinais</div>';
      semis.forEach((s, i) => {
        html += `<div class="match-box">
          <div class="match-player ${s.winner === s.p1 ? 'winner' : ''}">${s.p1}</div>
          <div class="vs-label">vs</div>
          <div class="match-player ${s.winner === s.p2 ? 'winner' : ''}">${s.p2}</div>`;
        
        if (userType === 'admin' && !s.winner) {
          html += `<div class="match-buttons">
            <button class="btn btn-secondary" onclick="window.app.regVencedor('semi', ${i}, '${s.p1}')">P1</button>
            <button class="btn btn-secondary" onclick="window.app.regVencedor('semi', ${i}, '${s.p2}')">P2</button>
          </div>`;
        }
        
        html += '</div>';
      });
      html += '</div>';
    }
    
    if (finais) {
      html += '<div class="bracket-column"><div class="bracket-title">Final</div>';
      html += `<div class="match-box">
        <div class="match-player ${finais.winner === finais.p1 ? 'winner' : ''}" style="font-weight: 600;">${finais.p1}</div>
        <div class="vs-label">vs</div>
        <div class="match-player ${finais.winner === finais.p2 ? 'winner' : ''}" style="font-weight: 600;">${finais.p2}</div>`;
      
      if (userType === 'admin' && !finais.winner) {
        html += `<div class="match-buttons">
          <button class="btn btn-primary" onclick="window.app.regVencedor('final', 0, '${finais.p1}')">P1 Vence</button>
          <button class="btn btn-primary" onclick="window.app.regVencedor('final', 0, '${finais.p2}')">P2 Vence</button>
        </div>`;
      } else if (finais.winner) {
        html += `<div style="margin-top: 12px; text-align: center; font-weight: 600; color: #4caf50; font-size: 16px;">🏆 ${finais.winner}</div>`;
      }
      
      html += '</div></div>';
    }
    
    html += '</div>';
    container.innerHTML = html;
  },
  
  regVencedor(fase, index, vencedor) {
    if (fase === 'quarta') {
      const quartas = JSON.parse(localStorage.getItem('quartas') || '[]');
      let semis = JSON.parse(localStorage.getItem('semis') || '[]');
      
      while (semis.length <= index) {
        semis.push(null);
      }
      if (!semis[index]) semis[index] = {};
      semis[index].winner = vencedor;
      
      const vencedores = quartas.map((q, i) => semis[i]?.winner).filter(Boolean);
      if (vencedores.length === 4) {
        const novasSemis = [
          { p1: vencedores[0], p2: vencedores[1], winner: null },
          { p1: vencedores[2], p2: vencedores[3], winner: null }
        ];
        localStorage.setItem('semis', JSON.stringify(novasSemis));
      } else {
        localStorage.setItem('semis', JSON.stringify(semis));
      }
    } else if (fase === 'semi') {
      const semis = JSON.parse(localStorage.getItem('semis') || '[]');
      semis[index].winner = vencedor;
      localStorage.setItem('semis', JSON.stringify(semis));
      
      if (semis[0]?.winner && semis[1]?.winner) {
        const finais = { p1: semis[0].winner, p2: semis[1].winner, winner: null };
        localStorage.setItem('finais', JSON.stringify(finais));
      }
    } else if (fase === 'final') {
      const finais = JSON.parse(localStorage.getItem('finais') || 'null');
      finais.winner = vencedor;
      localStorage.setItem('finais', JSON.stringify(finais));
    }
    
    this.renderQuadro();
  }
};

// Inicializar com modo viewer por padrão
if (!localStorage.getItem('userType')) {
  localStorage.setItem('userType', 'viewer');
}

renderApp();

// Sincronizar dados quando outro usuário/aba fizer mudanças
window.addEventListener('storage', () => {
  // Detecta mudanças no localStorage de outra aba/janela
  const activeTab = document.querySelector('.tab-content.active');
  if (activeTab) {
    const tabId = activeTab.id;
    if (tabId === 'grupos') window.app.renderGrupos();
    if (tabId === 'jogos') window.app.renderJogos();
    if (tabId === 'partidas') window.app.renderPartidas();
    if (tabId === 'sorteio') window.app.renderSorteio();
    if (tabId === 'quadro') window.app.renderQuadro();
  }
});
</script>

</body>
</html>
